<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lista Mensual Senda</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);let todos=[];
window.addEventListener('DOMContentLoaded',()=>{let mes=document.getElementById('filtroMes');mes.value=new Date().toISOString().slice(0,7);onSnapshot(collection(db,"pacientes_senda"),snap=>{todos=[];snap.forEach(d=>todos.push({id:d.id,...d.data()}));render();});});
window.render=function(){let mes=document.getElementById('filtroMes').value;let estado=document.getElementById('filtroEstado').value;let rol=document.getElementById('filtroRol').value;let tbody=document.getElementById('tbody');tbody.innerHTML="";let filtrados=todos.filter(p=>{if(mes&&p.fecha&&!p.fecha.startsWith(mes))return false;if(estado&&p.estado!==estado)return false;if(rol==='TECNICO'&&p.estado==='FINALIZADO')return false;if(rol==='INFORMANTE'&&(p.estado!=='A_INFORMAR'&&p.estado!=='INFORMADO'))return false;return true;});let total=0;filtrados.sort((a,b)=>a.fecha.localeCompare(b.fecha));filtrados.forEach(p=>{let tr=document.createElement('tr');let color=p.estado==='NUEVO'?'#fbbf24':p.estado==='A_INFORMAR'?'#38bdf8':p.estado==='FINALIZADO'?'#4ade80':'#94a3b8';tr.innerHTML=`<td><a href="ficha.html?id=${p.id}" style="color:#00f5d4;font-weight:bold">${p.nro_estudio||p.id}</a></td><td>${p.fecha||''} ${p.hora||''}</td><td>${(p.apellidos||'')+' '+(p.nombres||'')}</td><td>${p.noche||''}</td><td><span style="background:${color};color:#000;padding:2px 6px;border-radius:4px;font-size:0.7rem;font-weight:bold">${p.estado||'NUEVO'}</span></td><td class="solo-admin">${p.plata_total||''}</td><td>${p.tipo_estudio||''}</td><td>${p.lugar||'SENDA'}</td>`;tbody.appendChild(tr);total+=Number(p.plata_total||0);});document.getElementById('totales').innerText=`Total mes: $${total.toLocaleString()} | Cant pacientes: ${filtrados.length} | Lun/Mar/Jue noche`;}
</script><style>:root{--dark:#0f172a;--card:#1e293b;--cyan:#00f5d4;--gold:#ffd166;--line:#334155}*{box-sizing:border-box;font-family:sans-serif}body{background:var(--dark);color:#fff;padding:10px;margin:0}.container{max-width:1100px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}table{width:100%;border-collapse:collapse;font-size:0.7rem}th,td{border:1px solid var(--line);padding:4px}th{background:#0f172a;color:var(--gold)}#totales{background:#0f172a;padding:8px;border-radius:6px;margin-top:8px;font-weight:bold;color:var(--gold)}</style></head><body><div class="container"><h1 style="color:var(--cyan);text-align:center;font-size:1rem">📊 LISTA MENSUAL - Solo Lun Mar Jue Noche + Plata (Solo vos)</h1><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><input type="month" id="filtroMes" onchange="render()"><select id="filtroEstado" onchange="render()"><option value="">Todos estados</option><option>NUEVO</option><option>FALTA_PAPELES</option><option>A_INFORMAR</option><option>INFORMADO</option><option>FINALIZADO</option></select><select id="filtroRol" onchange="render()"><option value="ADMIN">ADMIN ve todo y plata</option><option value="TECNICO">TECNICO solo activos</option><option value="INFORMANTE">INFORMANTE solo A_INFORMAR</option></select><button onclick="render()" style="padding:6px 10px;background:var(--cyan);border:none;border-radius:6px;font-weight:bold">Filtrar</button></div><table><thead><tr><th>N°</th><th>Fecha Hora</th><th>Paciente</th><th>Noche</th><th>Estado</th><th>$Total</th><th>Tipo</th><th>Lugar</th></tr></thead><tbody id="tbody"></tbody></table><div id="totales"></div><div style="text-align:center;margin-top:8px"><a href="admin_auto.html" style="color:var(--cyan)">Admin Auto</a> | <a href="ficha.html" style="color:var(--gold)">Ficha</a></div></div></body></html>
