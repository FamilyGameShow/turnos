<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENDA Turno v18 FIX</title>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,addDoc,getDocs,query,where,doc,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(cfg); const db=getFirestore(app);
let ordenB64="", pacienteEditId=null;
const PRECIOS={'EEG':'$100.000','PSG_BASAL':'$250.000','PSG_LARGA':'$350.000'};

window.cambiarTipoPorLugar=()=>{
 let lugar=document.getElementById('lugar').value;
 let tipoSel=document.getElementById('tipo');
 let html='';
 if(lugar=='DOMICILIO'){
   html+=`<option value="PSG_BASAL">PSG BASAL (2hs) - A CONVENIR</option><option value="PSG_LARGA" selected>PSG LARGA (6hs) - A CONVENIR</option>`;
   document.getElementById('infoPrecio').innerHTML=`<div style="background:#000;color:#7dd3fc;padding:10px;border-radius:10px;font-weight:800">DOMICILIO: Precio A CONVENIR - Solo PSG - Días LUN/MAR/DOM</div>`;
 } else {
   html+=`<option value="EEG">EEG (1hs) $100.000</option><option value="PSG_BASAL">PSG BASAL (2hs) $250.000</option><option value="PSG_LARGA" selected>PSG LARGA (6hs) $350.000</option>`;
 }
 tipoSel.innerHTML=html; cambiarHoras();
}
window.leerOrden=(i)=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{ordenB64=e.target.result;document.getElementById('avisoOrden').innerText='✅ '+f.name;};r.readAsDataURL(f);}
const BLOQUES={'21:00-22:00':[21,22],'22:00-23:00':[22,23],'21:00-23:00':[21,23],'23:00-01:00':[23,25],'01:00-03:00':[25,27],'03:00-05:00':[27,29],'23:00-05:00':[23,29],'10:00-13:00':[10,13]};
function choque(n,exs){let a=BLOQUES[n]||[0,0];for(let ex of exs){if(ex.estado=='CANCELADO')continue;let b=BLOQUES[ex.hora]||[0,0];if(a[0]<b[1]&&b[0]<a[1])return ex;}return null;}
window.cambiarHoras=async()=>{
 let t=document.getElementById('tipo').value, lugar=document.getElementById('lugar').value;
 let sel=document.getElementById('hora'); let ops=t=='EEG'?['21:00-22:00','22:00-23:00']:t=='PSG_BASAL'?['21:00-23:00','23:00-01:00','01:00-03:00','03:00-05:00']:['23:00-05:00'];
 let fecha=document.getElementById('fecha').value; let ocup=[]; if(fecha){try{let q=query(collection(db,"pacientes_senda"),where("fecha","==",fecha));let s=await getDocs(q);s.forEach(d=>ocup.push(d.data()));}catch(e){}}
 sel.innerHTML=''; for(let op of ops){let ch=choque(op,ocup);let o=document.createElement('option');o.value=op;o.text=ch?op+' ❌ OCUPADO':'✅ '+op;if(ch)o.disabled=true;sel.appendChild(o);}
 if(lugar!='DOMICILIO'){ document.getElementById('infoPrecio').innerHTML=`Estimado ${PRECIOS[t]} (final a confirmar)`; }
}
window.validarDia=async()=>{
 let f=document.getElementById('fecha').value;if(!f)return;let d=new Date(f+'T12:00:00');let dia=d.getDay();let lugar=document.getElementById('lugar').value;let tipo=document.getElementById('tipo').value;
 let permitidos=[];
 if(lugar=='DOMICILIO') permitidos=[0,1,2]; // DOM LUN MAR
 else if(tipo=='PSG_LARGA') permitidos=[0,1,2,4]; // LARGA LUN MAR JUE DOM
 else permitidos=[1,2,4]; // SENDA normal LUN MAR JUE
 if(!permitidos.includes(dia)){document.getElementById('aviso').innerHTML=`❌ Ese lugar/tipo no atiende ese día. Permitidos: ${permitidos.map(x=>['DOM','LUN','MAR','MIE','JUE','VIE','SAB'][x]).join(', ')}`;document.getElementById('btn').disabled=true;return;}
 document.getElementById('aviso').innerHTML='✅ '+['DOM','LUN','MAR','MIE','JUE','VIE','SAB'][dia];document.getElementById('btn').disabled=false;cambiarHoras();
 let qb=await getDocs(query(collection(db,"bloqueos_senda"),where("fecha","==",f))); if(!qb.empty){document.getElementById('aviso').innerHTML='❌ BLOQUEADO: '+qb.docs[0].data().motivo;document.getElementById('btn').disabled=true;}
}

// YA ESTOY REGISTRADO - RECUPERAR POR DNI
window.buscarPorDni=async()=>{
 let dni=document.getElementById('dniBusqueda').value.trim(); if(!dni) return alert('Pone DNI');
 let q=query(collection(db,"pacientes_senda"),where("dni","==",dni)); let s=await getDocs(q);
 if(s.empty) return alert('No encontramos DNI '+dni);
 let p=s.docs[0].data(); pacienteEditId=s.docs[0].id;
 document.getElementById('boxRecuperado').innerHTML=`<div style="background:#d9f99d;color:#000;padding:12px;border-radius:10px"><b>Encontrado: ${p.apellidos} ${p.nombres} - ${p.tipo_estudio} ${p.fecha} ${p.hora} - Estado ${p.estado}</b><br>Podés actualizar datos o subir orden nueva.</div>`;
 document.getElementById('ap').value=p.apellidos; document.getElementById('no').value=p.nombres; document.getElementById('tel').value=p.telefono;
 document.getElementById('fnac').value=p.fecha_nacimiento||p.extra?.fnac||''; document.getElementById('edad').value=p.edad||p.extra?.edad||''; document.getElementById('dom').value=p.domicilio||p.extra?.dom||''; document.getElementById('loc').value=p.localidad||p.extra?.loc||''; document.getElementById('med').value=p.medico_solicitante||p.extra?.med||''; document.getElementById('diag').value=p.diagnostico||p.extra?.diag||''; document.getElementById('medic').value=p.medicacion||p.extra?.medic||''; document.getElementById('obs').value=p.observacion||p.extra?.obs||'';
 document.getElementById('btn').innerText='Actualizar mi ficha / Subir orden';
}

window.enviar=async()=>{
 let ap=document.getElementById('ap').value.toUpperCase().trim(),no=document.getElementById('no').value.toUpperCase().trim(),dni=document.getElementById('dni').value.trim(),tel=document.getElementById('tel').value.trim(),os=document.getElementById('os').value,fecha=document.getElementById('fecha').value,hora=document.getElementById('hora').value,tipo=document.getElementById('tipo').value,lugar=document.getElementById('lugar').value;
 let fnac=document.getElementById('fnac').value,edad=document.getElementById('edad').value,dom=document.getElementById('dom').value,loc=document.getElementById('loc').value,med=document.getElementById('med').value,diag=document.getElementById('diag').value,medic=document.getElementById('medic').value,obs=document.getElementById('obs').value;
 if(!ap||!no||!dni||!tel){alert('Falta apellido, nombre, DNI, tel');return;}
 // si es edicion
 if(pacienteEditId){
   let up={apellidos:ap,nombres:no,telefono:tel,obra_social:os,lugar:lugar,fecha_nacimiento:fnac,edad:edad,domicilio:dom,localidad:loc,medico_solicitante:med,diagnostico:diag,medicacion:medic,observacion:obs,extra:{fnac,edad,dom,loc,med,diag,medic,obs}};
   if(ordenB64){up.orden_base64=ordenB64; up['papeles.orden_foto']=true;}
   await updateDoc(doc(db,"pacientes_senda",pacienteEditId),up);
   document.getElementById('boxForm').innerHTML=`<div style="text-align:center;padding:20px"><h2 style="color:#22c55e">✅ FICHA ACTUALIZADA</h2><p>${ap} ${no} actualizamos tus datos. Si subiste orden nueva ya la vemos.</p><p style="background:#fff3cd;color:#000;padding:10px;border-radius:10px">Te confirmamos por WhatsApp.</p></div>`; return;
 }
 if(!fecha||!med||!diag){alert('Falta fecha, médico y diagnóstico');return;}
 document.getElementById('btn').innerText='Enviando...';document.getElementById('btn').disabled=true;
 let q=query(collection(db,"pacientes_senda"),where("fecha","==",fecha));let snap=await getDocs(q);let exs=[];snap.forEach(s=>exs.push(s.data()));if(choque(hora,exs)){alert('Horario ocupado');document.getElementById('btn').disabled=false;return;}
 try{
  let d=new Date(fecha+'T12:00:00'),noche=['DOM','LUN','MAR','MIE','JUE','VIE','SAB'][d.getDay()];
  let costo=lugar=='DOMICILIO'?'A CONVENIR':PRECIOS[tipo];
  let data={apellidos:ap,nombres:no,dni:dni,telefono:tel,obra_social:os,fecha:fecha,hora:hora,tipo_estudio:tipo,lugar:lugar,noche:noche,orden_base64:ordenB64,tiene_orden:!!ordenB64,estado:'PRE-TURNO',creado:new Date().toISOString(),fecha_nacimiento:fnac,edad:edad,domicilio:dom,localidad:loc,medico_solicitante:med,diagnostico:diag,medicacion:medic,observacion:obs,extra:{fnac,edad,dom,loc,med,diag,medic,obs},costo_estimado:costo,papeles:{orden_foto:!!ordenB64,autorizacion:false,confirmado:false,informe:false}};
  await addDoc(collection(db,"pacientes_senda"),data);
  document.getElementById('boxForm').innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:50px">✅</div><h2 style="color:#22c55e">PRE-TURNO RECIBIDO</h2><p><b>${ap} ${no}</b> ${tipo} ${fecha} ${hora} ${lugar} Costo ${costo}</p><div style="background:#fff3cd;color:#000;padding:12px;border-radius:10px">No te mandamos PDF todavía. Te confirmamos por WhatsApp con precio FINAL y link para confirmar/cambiar/cancelar.</div><button onclick="location.reload()" style="margin-top:12px;padding:12px 20px;background:#00f5d4;border:none;border-radius:10px;font-weight:800">Volver</button></div>`;
 }catch(e){alert(e.message);document.getElementById('btn').disabled=false;}
}
window.onload=()=>{cambiarTipoPorLugar();};
</script>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px}.box{max-width:640px;margin:auto;background:#1e293b;padding:16px;border-radius:18px}
input,select,textarea{width:100%;padding:11px;border-radius:9px;background:#fff;color:#000;margin-top:4px;box-sizing:border-box;font-weight:600;border:1px solid #94a3b8}
label{font-size:0.72rem;color:#000;margin-top:10px;display:block;font-weight:900;background:#fef3c7;padding:3px 6px;border-radius:4px;width:fit-content}
.amaBox{background:#fef3c7;padding:12px;border-radius:12px;margin-top:8px;border:2px solid #f59e0b}
.amaBox label{background:#f59e0b;color:#000}
.topBtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.topBtns button{flex:1;min-width:100px;padding:10px;border:none;border-radius:10px;font-weight:800;font-size:0.75rem}
</style>
</head>
<body>
<div class="box" id="boxForm">
<div class="topBtns">
<button onclick="document.getElementById('faq').style.display=document.getElementById('faq').style.display=='none'?'block':'none'" style="background:#334155;color:#fff">❓ Preguntas y dudas</button>
<button onclick="document.getElementById('boxBuscar').style.display=document.getElementById('boxBuscar').style.display=='none'?'block':'none'" style="background:#f59e0b;color:#000">🔍 Ya estoy registrado / Ya pedí turno</button>
<button onclick="document.getElementById('formNuevo').style.display='block';document.getElementById('boxBuscar').style.display='none'" style="background:#00f5d4;color:#000">📝 Pedir turno nuevo</button>
</div>
<div id="faq" style="display:none;background:#0f172a;padding:12px;border-radius:12px;font-size:0.8rem;margin-bottom:10px">
<b>¿Qué estudio?</b> EEG prolongado/sueño = EEG 1hs<br>PSG diurna/nocturna = BASAL 2hs<br>PSG toda la noche/insomnio/oximetría = LARGA 6hs<br><b>DOMICILIO:</b> solo PSG, precio A CONVENIR, días DOM/LUN/MAR<br><b>PSG LARGA SENDA/ESPAÑOL:</b> LUN/MAR/JUE/DOM<br><b>Resto:</b> LUN/MAR/JUE<br>Nosotros corregimos si hace falta.
</div>
<div id="boxBuscar" style="display:none;background:#fff3cd;padding:12px;border-radius:12px;margin-bottom:10px">
<label style="background:#000;color:#fff">Ya pediste turno? Poné tu DNI y recuperá tu ficha para subir orden o completar datos</label>
<input id="dniBusqueda" placeholder="DNI sin puntos" style="margin-top:6px"><button onclick="buscarPorDni()" style="margin-top:6px;padding:10px;background:#000;color:#fff;border:none;border-radius:8px;width:100%;font-weight:800">Buscar mi ficha</button>
<div id="boxRecuperado" style="margin-top:8px"></div>
</div>

<div id="formNuevo">
<h2 style="text-align:center;color:#00f5d4;margin:0 0 6px 0">SENDA - Turno</h2>
<label>Apellidos*</label><input id="ap"><label>Nombres*</label><input id="no"><label>DNI*</label><input id="dni"><label>WhatsApp*</label><input id="tel">
<label>Obra Social</label><select id="os"><option>PARTICULAR</option><option>IOMA</option><option>OSDE</option><option>OSPE</option><option>OSPE PMO</option><option>SWISS MEDICAL</option><option>GALENO</option><option>MEDICUS</option><option>OMINT</option><option>PAMI</option><option>OTRA</option></select>
<label>Lugar</label><select id="lugar" onchange="cambiarTipoPorLugar()"><option>SENDA</option><option>DOMICILIO</option><option>ESPAÑOL</option></select>
<label>Tipo estudio*</label><select id="tipo" onchange="cambiarHoras()"></select>
<div id="infoPrecio" style="margin-top:8px;font-size:0.8rem"></div>
<label>Orden médica (foto)</label><div style="background:#fff;padding:8px;border-radius:8px"><input type="file" accept="image/*" capture="environment" onchange="leerOrden(this)"><div id="avisoOrden" style="font-size:0.8rem;color:#000;margin-top:4px"></div></div>

<div class="amaBox">
<label>Fecha nacimiento</label><input type="date" id="fnac"><label>Edad</label><input id="edad"><label>Domicilio</label><input id="dom"><label>Localidad</label><input id="loc"><label>Médico solicitante*</label><input id="med"><label>Diagnóstico / motivo*</label><textarea id="diag" rows="2"></textarea><label>Medicación</label><input id="medic"><label>Observación</label><textarea id="obs" rows="2"></textarea>
</div>

<label style="background:#000;color:#00f5d4">Fecha (según lugar)</label><input type="date" id="fecha" onchange="validarDia()"><div id="aviso" style="font-size:0.8rem;margin-top:4px"></div>
<label style="background:#000;color:#00f5d4">Hora</label><select id="hora"></select>
<button id="btn" onclick="enviar()" style="width:100%;padding:14px;margin-top:14px;background:#00f5d4;color:#000;font-weight:900;border:none;border-radius:12px">Enviar Pre-Turno / Actualizar</button>
</div>
</div>
</body>
</html>
