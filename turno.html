<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENDA - Turno v16</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(cfg); const db=getFirestore(app);

const OS_INFO={
 'IOMA':'IOMA: NO requiere autorización si es la 1ra del año. Diferenciado $15.000 a pagar el día del estudio.',
 'OSDE':'OSDE: Lo autorizamos nosotros con token. Sin diferenciado.',
 'OSPE':'OSPE: Lo autoriza el paciente por web de OSPE. Sin diferenciado.',
 'OSPE PMO':'OSPE PMO: Se autoriza en Instituto Central de Medicina. Sin diferenciado.',
 'SWISS MEDICAL':'SWISS MEDICAL: No requiere autorización. Sin diferenciado.',
 'GALENO':'GALENO: Autoriza el afiliado. Sin costo.',
 'MEDICUS':'MEDICUS: No requiere autorización. Sin diferenciado.',
 'OMINT':'OMINT: No requiere autorización. Sin diferenciado.',
 'PAMI':'PAMI: NO trabajamos. Se toma como PARTICULAR.',
 'PARTICULAR':'',
 'OTRA':'Traer orden + carnet. Consultar autorización.'
};
const PRECIOS={'EEG':'$100.000','PSG_BASAL':'$150.000','PSG_DIURNA':'$150.000','PSG_NOCTURNA':'$200.000','PSG_RESP':'$350.000'};
let ordenB64="";

window.toggleOrden=()=>{document.getElementById('boxOrden').style.display=document.getElementById('tieneOrden').value=='SI'?'block':'none';}
window.mostrarInfo=()=>{
 let os=document.getElementById('os').value; let tipo=document.getElementById('tipo').value;
 let div=document.getElementById('infoOS'); let html='';
 if(OS_INFO[os]) html+=`<div style="background:#fff3cd;border:1px solid #f59e0b;padding:10px;border-radius:10px;color:#000;font-size:0.84rem;font-weight:700">${OS_INFO[os]}</div>`;
 if(os=='IOMA') html+=`<div style="background:#000;color:#ffd166;padding:8px;border-radius:8px;margin-top:6px;font-weight:800">Diferenciado: $15.000</div>`;
 if(os=='PARTICULAR'){
   let precio=PRECIOS[tipo]||'';
   if(precio) html+=`<div style="background:#000;color:#00f5d4;padding:12px;border-radius:10px;margin-top:8px;font-weight:900;font-size:1.1rem;text-align:center">ESTE ESTUDIO PARTICULAR: ${precio}<br><span style="font-size:0.8rem;color:#fff;font-weight:600">Se abona el día del estudio</span></div>`;
 }
 if(os!='PARTICULAR' && os!='PAMI' && os!='OTRA') html+=`<div style="background:#000;color:#22c55e;padding:7px;border-radius:8px;margin-top:6px;font-weight:700;font-size:0.8rem">Costo: $0 (sin diferenciado)</div>`;
 div.innerHTML=html;
}
window.leerOrden=(i)=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{ordenB64=e.target.result;document.getElementById('avisoOrden').innerHTML='✅ Orden cargada'};r.readAsDataURL(f);}

const BLOQUES={'21:00-22:00':[21,22],'22:00-23:00':[22,23],'21:00-23:00':[21,23],'23:00-01:00':[23,25],'01:00-03:00':[25,27],'03:00-05:00':[27,29],'23:00-05:00':[23,29],'10:00-13:00':[10,13]};
function choque(n,exs){let a=BLOQUES[n]||[0,0];for(let ex of exs){if(ex.estado=='CANCELADO')continue;let b=BLOQUES[ex.hora]||[0,0];if(a[0]<b[1]&&b[0]<a[1])return ex;}return null;}

window.cambiarHoras=async()=>{
 let t=document.getElementById('tipo').value, sel=document.getElementById('hora'), fecha=document.getElementById('fecha').value;
 let ops=t=='EEG'?['21:00-22:00','22:00-23:00']:t=='PSG_BASAL'?['21:00-23:00','23:00-01:00','01:00-03:00','03:00-05:00']:t=='PSG_DIURNA'?['10:00-13:00']:['23:00-05:00'];
 let ocup=[]; if(fecha){try{let q=query(collection(db,"pacientes_senda"),where("fecha","==",fecha));let s=await getDocs(q);s.forEach(d=>ocup.push(d.data()));}catch(e){}}
 sel.innerHTML=''; for(let op of ops){let ch=choque(op,ocup);let o=document.createElement('option');o.value=op;o.text=ch?op+' ❌ OCUPADO':op;if(ch)o.disabled=true;sel.appendChild(o);} mostrarInfo();
}
window.validarDia=()=>{let f=document.getElementById('fecha').value;if(!f)return;let dia=new Date(f+'T12:00:00').getDay();let b=document.getElementById('btn'),av=document.getElementById('aviso');if(dia!=1&&dia!=2&&dia!=4){av.innerHTML='❌ Solo atendemos LUNES, MARTES y JUEVES';b.disabled=true;}else{av.innerHTML='✅ '+(dia==1?'LUNES':dia==2?'MARTES':'JUEVES');b.disabled=false;cambiarHoras();}}

window.enviar=async()=>{
 let ap=document.getElementById('ap').value.toUpperCase().trim(),no=document.getElementById('no').value.toUpperCase().trim(),dni=document.getElementById('dni').value.trim(),tel=document.getElementById('tel').value.trim(),os=document.getElementById('os').value,fecha=document.getElementById('fecha').value,hora=document.getElementById('hora').value,tipo=document.getElementById('tipo').value,tiene=document.getElementById('tieneOrden').value;
 if(!ap||!no||!dni||!fecha||!tel){alert('Faltan datos');return;} if(tiene=='SI'&&!ordenB64){alert('Subí foto de orden');return;}
 document.getElementById('btn').innerHTML='Verificando disponibilidad...'; document.getElementById('btn').disabled=true;
 let q=query(collection(db,"pacientes_senda"),where("fecha","==",fecha));let snap=await getDocs(q);let exs=[];snap.forEach(s=>exs.push(s.data()));let ch=choque(hora,exs);
 if(ch){alert('Ese bloque ya está ocupado por '+ch.apellidos);document.getElementById('btn').innerHTML='Solicitar Turno';document.getElementById('btn').disabled=false;return;}
 try{
  let d=new Date(fecha+'T12:00:00'),noche=d.getDay()==1?'LUNES':d.getDay()==2?'MARTES':'JUEVES',diaNum=fecha.split('-')[2]+'/'+fecha.split('-')[1];
  let costoTxt=os=='PARTICULAR'?PRECIOS[tipo]:os=='IOMA'?'$15.000':'$0';
  let infoTxt=OS_INFO[os]||''; if(os=='PARTICULAR') infoTxt='PARTICULAR '+costoTxt+' - '+tipo;
  let data={apellidos:ap,nombres:no,dni:dni,telefono:tel,obra_social:os,fecha:fecha,hora:hora,tipo_estudio:tipo,noche:noche,orden_base64:ordenB64,tiene_orden:tiene=='SI',estado:tiene=='SI'?'PRE-RESERVA':'FALTA_ORDEN',creado:new Date().toISOString(),costo:costoTxt,papeles:{orden_foto:!!ordenB64,orden_original:false,autorizacion:false,pago:false,confirmado:false}};
  let docRef=await addDoc(collection(db,"pacientes_senda"),data);
  let w=window.open('','','width=800,height=950');
  w.document.write(`<html><head><meta charset="UTF-8"><title>TURNO SENDA</title></head><body style="margin:0;background:#2ecc71;padding:10px;font-family:Arial"><div style="max-width:700px;margin:auto;background:white;border:3px solid black"><div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:3px solid black"><div style="font-weight:900">SENDA COMUNIDAD</div><div style="font-weight:900;font-size:24px">TURNO</div></div><div style="text-align:center;font-weight:700;padding:6px;border-bottom:2px solid black">TURNO PARA ESTUDIO NEUROLOGICO - ${tipo}</div><div style="border:3px solid black;margin:8px;padding:10px;font-size:20px;font-weight:800">DIA: ${noche} ${diaNum}</div><div style="border:3px solid black;margin:8px;padding:10px;font-size:20px;font-weight:800;text-align:center">HORA: ${hora.split('-')[0]}hs - ${ap} ${no}</div><div style="border:3px solid black;margin:8px;padding:10px;font-size:15px;font-weight:700">LUGAR: 56 N°1321 e/21 y 22 La Plata<br>OS: ${os} - ${infoTxt}<br>DNI: ${dni} TEL: ${tel}<br><span style="background:yellow;padding:3px 8px">COSTO: ${costoTxt}</span></div><div style="border:2px solid red;margin:8px;padding:8px;text-align:center;font-size:13px"><b>El dia del estudio:</b><br>- pelo lavado, seco, sin crema<br>- sin esmalte uñas<br>- privacion sueno<br>- orden autorizada (IOMA NO REQUIERE SI ES 1RA DEL AÑO)<br><b>${infoTxt}</b></div><div style="padding:8px;font-size:11px;font-weight:700">INFORME 10-15 DIAS PDF - TEL 2215983871<br>ID ${docRef.id}</div></div><div style="text-align:center;margin-top:12px"><button onclick="window.print()" style="padding:16px 30px;background:#000;color:#fff;font-weight:900;border:none">IMPRIMIR / GUARDAR PDF</button></div></body></html>`);
  location.reload();
 }catch(e){alert(e.message);document.getElementById('btn').disabled=false;}
}
window.onload=()=>{cambiarHoras();toggleOrden();mostrarInfo();};
</script>
<style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px}.box{max-width:560px;margin:auto;background:#1e293b;padding:20px;border-radius:20px;border:1px solid #334155}input,select{width:100%;padding:13px;border-radius:11px;background:#0f172a;border:1px solid #334155;color:#fff;margin-top:5px;font-size:0.95rem}label{font-size:0.72rem;color:#ffd166;margin-top:12px;display:block;font-weight:800;letter-spacing:0.5px}#boxOrden{background:#0f172a;border:1px dashed #f59e0b;padding:10px;border-radius:10px;margin-top:6px}</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#00f5d4;margin:0 0 6px 0">SENDA - Solicitar Turno</h2><p style="text-align:center;color:#94a3b8;font-size:0.7rem;margin:0 0 10px 0">56 N°1321 e/21 y 22 La Plata - 2215983871</p>

<label>Apellidos</label><input id="ap" placeholder="GARCIA">
<label>Nombres</label><input id="no" placeholder="MARIA">
<label>DNI</label><input id="dni" placeholder="30123456">
<label>WhatsApp (con característica)</label><input id="tel" placeholder="221 123 4567">

<label>Obra Social</label>
<select id="os" onchange="mostrarInfo()">
<option>PARTICULAR</option><option>IOMA</option><option>OSDE</option><option>OSPE</option><option>OSPE PMO</option><option>SWISS MEDICAL</option><option>GALENO</option><option>MEDICUS</option><option>OMINT</option><option>PAMI</option><option>OTRA</option>
</select>

<label>Tipo de estudio</label>
<select id="tipo" onchange="mostrarInfo();cambiarHoras()">
<option value="EEG">EEG</option>
<option value="PSG_BASAL">PSG BASAL</option>
<option value="PSG_DIURNA">PSG DIURNA</option>
<option value="PSG_NOCTURNA">PSG NOCTURNA</option>
<option value="PSG_RESP" selected>PSG RESPIRATORIA con oximetria</option>
</select>

<div id="infoOS" style="margin-top:10px"></div>

<label>¿Tenés orden médica?</label>
<select id="tieneOrden" onchange="toggleOrden()">
<option value="SI">SI, TENGO ORDEN</option>
<option value="NO">NO TENGO TODAVIA - LA LLEVO EL DIA DEL ESTUDIO</option>
</select>
<div id="boxOrden"><input type="file" accept="image/*" capture="environment" onchange="leerOrden(this)"><div id="avisoOrden" style="font-size:0.8rem;color:#00f5d4;margin-top:6px"></div></div>

<label>Fecha (solo Lunes, Martes, Jueves)</label><input type="date" id="fecha" onchange="validarDia()"><div id="aviso" style="margin-top:6px;font-size:0.8rem"></div>
<label>Bloque horario</label><select id="hora"></select>

<button id="btn" onclick="enviar()" style="width:100%;padding:15px;margin-top:18px;background:#00f5d4;color:#000;font-weight:900;border:none;border-radius:12px;font-size:1rem">Solicitar Turno</button>
<div style="margin-top:10px;font-size:0.65rem;color:#64748b;text-align:center">Al elegir obra social y estudio verás costo y trámite de autorización.<br>El comprobante PDF incluye todo.</div>
</div>
</body>
</html>
