<!DOCTYPE html><html lang="es" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SENDA Turno - Lun Mar Jue Noche</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
function diaSemana(fecha){let d=new Date(fecha+'T12:00:00');return d.getDay();} //0 Dom 1 Lun 2 Mar 3 Mie 4 Jue 5 Vie
window.enviar=async()=>{
 let fecha=document.getElementById('fecha').value; if(!fecha){alert('Elegí fecha');return;}
 let dia=diaSemana(fecha); if(dia!==1 && dia!==2 && dia!==4){alert('Solo atendemos NOCHE DE LUNES, MARTES Y JUEVES. Elegí Lun, Mar o Jue. No hay Viernes.');return;}
 let hora=document.getElementById('hora').value||'22:00';
 let snap=await getDocs(collection(db,"pacientes_senda")); let ocupado=false; snap.forEach(doc=>{let p=doc.data(); if(p.fecha===fecha) ocupado=true;});
 if(ocupado){alert('Esa noche ya está ocupada. Probá con otra noche Lun/Mar/Jue.');return;}
 let data={nro_estudio:'PSG'+Date.now().toString().slice(-6),apellidos:document.getElementById('apellidos').value.toUpperCase(),nombres:document.getElementById('nombres').value.toUpperCase(),dni:document.getElementById('dni').value,obra_social:document.getElementById('os').value,telefono:document.getElementById('tel').value,fecha:fecha,hora:hora,noche: (dia===1?'NOCHE DEL LUNES':dia===2?'NOCHE DEL MARTES':'NOCHE DEL JUEVES'),lugar:'SENDA',tipo_estudio:'PSG NOCTURNO',estado:'NUEVO',creado:new Date().toISOString()};
 await addDoc(collection(db,"pacientes_senda"),data);
 document.getElementById('form').innerHTML=`<div style="background:#10b981;color:#000;padding:20px;border-radius:10px;text-align:center"><h2>✅ Turno pedido!</h2><p><b>${data.noche} ${data.fecha} ${data.hora}hs</b></p><p>Aclaración: ${data.noche} quiere decir que te quedás a dormir. Si dice Lunes 03hs es lunes de noche, madrugada del martes.</p><p>N° ${data.nro_estudio}</p></div>`;
};
</script><style>:root{--dark:#0f172a;--card:#1e293b;--cyan:#00f5d4;--gold:#ffd166;--line:#334155}*{box-sizing:border-box;font-family:sans-serif}body{background:var(--dark);color:#fff;padding:12px;margin:0}.box{max-width:500px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}label{font-size:0.7rem;color:var(--gold);display:block;margin-top:8px}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0f172a;color:#fff;margin-top:4px}.aviso{background:#0f172a;border:1px dashed var(--cyan);padding:8px;border-radius:8px;font-size:0.7rem;margin:8px 0;color:#94a3b8}button{width:100%;padding:12px;background:var(--cyan);color:#000;font-weight:bold;border:none;border-radius:8px;margin-top:12px;font-size:1rem}</style></head><body><div class="box"><h2 class="notranslate" style="color:var(--cyan);text-align:center;margin:0">🌙 SENDA COMUNIDAD<br>Turno Polisomnografía Nocturna</h2><div class="aviso"><b>Solo NOCHE de LUNES, MARTES y JUEVES. No hay viernes.</b><br>• Si elegís LUNES 22hs, te quedás a dormir lunes a la noche. Si ves LUNES 03:00 es la misma noche, madrugada del martes.<br>• Lo mismo para MARTES y JUEVES noche.</div><div id="form"><label>Apellidos</label><input id="apellidos" autocomplete="off"><label>Nombres</label><input id="nombres"><label>DNI</label><input id="dni"><label>Obra Social / Particular</label><input id="os" value="PARTICULAR"><label>Tel / WhatsApp</label><input id="tel"><label>Fecha - Solo Lun Mar Jue</label><input type="date" id="fecha"><label>Horario (queda 22hs)</label><select id="hora"><option value="22:00">22:00 Noche</option><option value="22:30">22:30</option><option value="23:00">23:00</option></select><button onclick="enviar()" class="notranslate">Reservar Noche</button></div></div></body></html>
