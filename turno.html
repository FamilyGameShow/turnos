<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENDA Turno v17 - Pre Turno + Ficha</title>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,addDoc,getDocs,query,where} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(cfg); const db=getFirestore(app);
const PRECIOS={'EEG':'$100.000','PSG_BASAL':'$250.000','PSG_LARGA':'$350.000'};
let ordenB64="";
window.toggleOrden=()=>{let t=document.getElementById('tieneOrden').value;document.getElementById('boxOrden').style.display=t=='SI'?'block':'none';document.getElementById('boxExtra').style.display='block';}
window.leerOrden=(i)=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{ordenB64=e.target.result;document.getElementById('avisoOrden').innerText='✅ Orden cargada: '+f.name;};r.readAsDataURL(f);}
const BLOQUES={'21:00-22:00':[21][22],'22:00-23:00':[22][23],'21:00-23:00':[21][23],'23:00-01:00':[23][25],'01:00-03:00':[25][27],'03:00-05:00':[27][29],'23:00-05:00':[23][29],'10:00-13:00':[10][13]};
function choque(n,exs){let a=BLOQUES[n]||[0][0];for(let ex of exs){if(ex.estado=='CANCELADO')continue;let b=BLOQUES[ex.hora]||[0][0];if(a[0]<b[1]&&b[0]<a[1])return ex;}return null;}
window.cambiarHoras=async()=>{
 let t=document.getElementById('tipo').value;let sel=document.getElementById('hora');let ops=t=='EEG'?['21:00-22:00','22:00-23:00']:t=='PSG_BASAL'?['21:00-23:00','23:00-01:00','01:00-03:00','03:00-05:00']:['23:00-05:00'];
 let fecha=document.getElementById('fecha').value;let ocup=[];if(fecha){try{let q=query(collection(db,"pacientes_senda"),where("fecha","==",fecha));let s=await getDocs(q);s.forEach(d=>ocup.push(d.data()));}catch(e){}}
 sel.innerHTML='';for(let op of ops){let ch=choque(op,ocup);let o=document.createElement('option');o.value=op;o.text=ch?op+' ❌ OCUPADO':'✅ '+op;if(ch)o.disabled=true;sel.appendChild(o);}
 document.getElementById('infoPrecio').innerHTML=`Estimado ${PRECIOS[t]} (a confirmar final según obra social y tipo real)`;
}
window.validarDia=async()=>{let f=document.getElementById('fecha').value;if(!f)return;let d=new Date(f+'T12:00:00');if(d.getDay()!=1&&d.getDay()!=2&&d.getDay()!=4){document.getElementById('aviso').innerHTML='❌ Solo LUN MAR JUE';document.getElementById('btn').disabled=true;}else{document.getElementById('aviso').innerHTML='✅ '+['DOM','LUN','MAR','MIE','JUE','VIE','SAB'][d.getDay()];document.getElementById('btn').disabled=false;cambiarHoras();let qb=await getDocs(query(collection(db,"bloqueos_senda"),where("fecha","==",f)));if(!qb.empty){document.getElementById('aviso').innerHTML='❌ DIA BLOQUEADO: '+qb.docs[0].data().motivo;document.getElementById('btn').disabled=true;}}}
window.enviar=async()=>{
 let ap=document.getElementById('ap').value.toUpperCase().trim(),no=document.getElementById('no').value.toUpperCase().trim(),dni=document.getElementById('dni').value.trim(),tel=document.getElementById('tel').value.trim(),os=document.getElementById('os').value,fecha=document.getElementById('fecha').value,hora=document.getElementById('hora').value,tipo=document.getElementById('tipo').value,lugar=document.getElementById('lugar').value,tiene=document.getElementById('tieneOrden').value;
 let fnac=document.getElementById('fnac').value,edad=document.getElementById('edad').value,dom=document.getElementById('dom').value,loc=document.getElementById('loc').value,med=document.getElementById('med').value,diag=document.getElementById('diag').value,medic=document.getElementById('medic').value,obs=document.getElementById('obs').value;
 if(!ap||!no||!dni||!tel||!fecha||!med||!diag){alert('Completá apellido, nombre, DNI, tel, médico solicitante y diagnóstico (obligatorio)');return;}
 if(tiene=='SI'&&!ordenB64){alert('Subí la foto de la orden');return;}
 document.getElementById('btn').innerText='Enviando...';document.getElementById('btn').disabled=true;
 let q=query(collection(db,"pacientes_senda"),where("fecha","==",fecha));let snap=await getDocs(q);let exs=[];snap.forEach(s=>exs.push(s.data()));if(choque(hora,exs)){alert('Horario ocupado');document.getElementById('btn').disabled=false;return;}
 try{
  let d=new Date(fecha+'T12:00:00'),noche=['DOM','LUN','MAR','MIE','JUE','VIE','SAB'][d.getDay()];
  let data={apellidos:ap,nombres:no,dni:dni,telefono:tel,obra_social:os,fecha:fecha,hora:hora,tipo_estudio:tipo,lugar:lugar,noche:noche,orden_base64:ordenB64,tiene_orden:tiene=='SI',estado:'PRE-TURNO',creado:new Date().toISOString(),fecha_nacimiento:fnac,edad:edad,domicilio:dom,localidad:loc,medico_solicitante:med,diagnostico:diag,medicacion:medic,observacion:obs,extra:{fnac,edad,dom,loc,med,diag,medic,obs},costo_estimado:PRECIOS[tipo],papeles:{orden_foto:!!ordenB64,autorizacion:false,confirmado:false,informe:false}};
  await addDoc(collection(db,"pacientes_senda"),data);
  document.getElementById('boxForm').innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:50px">✅</div><h2 style="color:#22c55e">PRE-TURNO RECIBIDO</h2><p><b>${ap} ${no}</b><br>${tipo} ${fecha} ${hora} en ${lugar}</p><div style="background:#fff3cd;color:#000;padding:14px;border-radius:12px"><b>No te enviamos PDF todavía.</b><br>Revisamos tu orden/diagnóstico y si hay que cambiar de BASAL a LARGA te avisamos.<br>Te llega la confirmación FINAL por WhatsApp con precio final y link para descargar PDF y confirmar/cambiar/cancelar.</div><button onclick="location.reload()" style="margin-top:14px;padding:12px 20px;background:#00f5d4;border:none;border-radius:10px;font-weight:800">Volver</button></div>`;
 }catch(e){alert(e.message);document.getElementById('btn').disabled=false;}
}
window.onload=()=>{cambiarHoras();toggleOrden();};
</script>
<style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px}.box{max-width:640px;margin:auto;background:#1e293b;padding:18px;border-radius:18px}input,select,textarea{width:100%;padding:11px;border-radius:9px;background:#0f172a;border:1px solid #334155;color:#fff;margin-top:4px;box-sizing:border-box}label{font-size:0.68rem;color:#ffd166;margin-top:10px;display:block;font-weight:800}.ama{background:#fef08a;color:#000;padding:8px;border-radius:8px;margin-top:8px}</style>
</head>
<body>
<div class="box" id="boxForm">
<h2 style="text-align:center;color:#00f5d4;margin:0">SENDA - Pre Turno v17</h2>
<div style="text-align:center;font-size:0.7rem;color:#94a3b8">56 N°1321 - 2215983871</div>
<div style="margin:10px 0"><button onclick="document.getElementById('faq').style.display=document.getElementById('faq').style.display=='none'?'block':'none'" style="width:100%;background:#334155;color:#fff;border:none;padding:9px;border-radius:8px;font-weight:700">❓ Dudas antes de sacar turno</button><div id="faq" style="display:none;margin-top:8px;font-size:0.78rem;background:#0f172a;padding:10px;border-radius:10px">EEG, EEG prolongado, sueño = <b>EEG 1hs</b><br>PSG diurna/nocturna/siesta = <b>PSG BASAL 2hs</b><br>PSG toda la noche, insomnio, con oximetría = <b>PSG LARGA 6hs</b><br>Nosotros verificamos y corregimos si hace falta.</div></div>

<label>Apellidos (amarillo)</label><input id="ap"><label>Nombres</label><input id="no"><label>DNI</label><input id="dni"><label>WhatsApp</label><input id="tel">
<label>Obra Social</label><select id="os"><option>PARTICULAR</option><option>IOMA</option><option>OSDE</option><option>OSPE</option><option>OSPE PMO</option><option>SWISS MEDICAL</option><option>GALENO</option><option>MEDICUS</option><option>OMINT</option><option>PAMI</option><option>OTRA</option></select>
<label>Lugar</label><select id="lugar"><option>SENDA</option><option>DOMICILIO</option><option>ESPAÑOL</option></select>
<label>Tipo de estudio (3 opciones)</label><select id="tipo" onchange="cambiarHoras()"><option value="EEG">EEG (1 hora) $100.000</option><option value="PSG_BASAL">PSG BASAL (2 horas) $250.000</option><option value="PSG_LARGA" selected>PSG LARGA (6 horas) $350.000</option></select>
<div id="infoPrecio" style="font-size:0.75rem;color:#94a3b8;margin-top:6px"></div>

<label>¿Tenés orden?</label><select id="tieneOrden" onchange="toggleOrden()"><option value="SI">SI, la subo</option><option value="NO">NO, cargo ficha</option></select>
<div id="boxOrden"><input type="file" accept="image/*" capture="environment" onchange="leerOrden(this)"><div id="avisoOrden" style="font-size:0.8rem;color:#00f5d4"></div></div>

<div id="boxExtra" class="ama">
<label>Fecha nac</label><input type="date" id="fnac"><label>Edad</label><input id="edad"><label>Domicilio</label><input id="dom"><label>Localidad</label><input id="loc"><label>Médico solicitante*</label><input id="med"><label>Diagnóstico / motivo*</label><textarea id="diag" rows="2"></textarea><label>Medicación</label><input id="medic"><label>Observación</label><textarea id="obs" rows="2"></textarea>
</div>

<label>Fecha (LUN MAR JUE)</label><input type="date" id="fecha" onchange="validarDia()"><div id="aviso" style="font-size:0.8rem;margin-top:4px"></div>
<label>Hora</label><select id="hora"></select>
<button id="btn" onclick="enviar()" style="width:100%;padding:14px;margin-top:14px;background:#00f5d4;color:#000;font-weight:900;border:none;border-radius:12px">Enviar Pre-Turno</button>
</div>
</body>
</html>
