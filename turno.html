<!DOCTYPE html><html lang="es" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SENDA</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(cfg);const db=getFirestore(app);
window.checkOS=()=>{document.getElementById('os_otra').style.display=document.getElementById('os').value=='OTRA'?'block':'none';}
window.cambiarHoras=()=>{
 let tipo=document.getElementById('tipo').value;let sel=document.getElementById('hora');sel.innerHTML='';
 if(tipo=='EEG'){sel.innerHTML='<option value="21:00-22:00">21:00 a 22:00</option><option value="22:00-23:00" selected>22:00 a 23:00</option>';}
 else if(tipo=='PSG_BASAL'){sel.innerHTML='<option value="21:00-23:00" selected>21:00 a 23:00 (2hs)</option><option value="23:00-01:00">23:00 a 01:00 (2hs)</option><option value="01:00-03:00">01:00 a 03:00 (2hs)</option><option value="03:00-05:00">03:00 a 05:00 (2hs)</option>';}
 else{sel.innerHTML='<option value="23:00-05:00" selected>23:00 a 05:00 - 6 horas</option><option value="21:00-23:00">21:00 a 23:00</option><option value="23:00-01:00">23:00 a 01:00</option><option value="01:00-03:00">01:00 a 03:00</option><option value="03:00-05:00">03:00 a 05:00</option>';}
}
window.validarDia=()=>{let f=document.getElementById('fecha').value;if(!f)return;let d=new Date(f+'T12:00:00');let dia=d.getDay();let txt=document.getElementById('avisoDia');if(dia!==1&&dia!==2&&dia!==4){txt.innerHTML='<b style="color:#ef4444">❌ Solo LUN MAR JUE</b>';document.getElementById('btn').disabled=true;}else{txt.innerHTML='<b style="color:#10b981">✅ '+(dia==1?'NOCHE LUNES':dia==2?'NOCHE MARTES':'NOCHE JUEVES')+'</b>';document.getElementById('btn').disabled=false;}}
window.enviar=async()=>{
 let ap=document.getElementById('apellidos').value.trim();let no=document.getElementById('nombres').value.trim();let dni=document.getElementById('dni').value.trim();let tel=document.getElementById('tel').value.trim();let fecha=document.getElementById('fecha').value;
 if(!ap){alert('Falta Apellido');return;}if(!no){alert('Falta Nombre');return;}if(!dni){alert('Falta DNI');return;}if(!tel){alert('Falta WhatsApp');return;}if(!fecha){alert('Falta fecha');return;}
 let d=new Date(fecha+'T12:00:00');if(d.getDay()!==1&&d.getDay()!==2&&d.getDay()!==4){alert('Solo Lun Mar Jue noche');return;}
 let os=document.getElementById('os').value;if(os=='OTRA'){os=document.getElementById('os_otra').value.trim();if(!os){alert('Escribí tu obra social');return;}}
 let hora=document.getElementById('hora').value;let tipo=document.getElementById('tipo').value;
 let data={apellidos:ap.toUpperCase(),nombres:no.toUpperCase(),dni:dni,obra_social:os.toUpperCase(),telefono:tel,tipo_estudio:tipo,fecha:fecha,hora:hora,noche:d.getDay()==1?'NOCHE DEL LUNES':d.getDay()==2?'NOCHE DEL MARTES':'NOCHE DEL JUEVES',estado:'PRE-RESERVA',creado:new Date().toISOString(),pre_codigo:'PRE-'+Date.now().toString().slice(-5)};
 await addDoc(collection(db,"pacientes_senda"),data);
 document.getElementById('form').innerHTML='<div style="background:#10b981;color:#000;padding:20px;border-radius:10px;text-align:center"><h2>✅ Pre-reserva enviada</h2><p><b>'+data.noche+' '+data.fecha+' '+data.hora+'</b><br>'+data.tipo_estudio+'<br>'+data.obra_social+'</p><p style="font-size:0.7rem">Te confirmamos por WhatsApp. Código: '+data.pre_codigo+'</p></div>';
};
window.onload=()=>cambiarHoras();
</script><style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:12px}.box{max-width:520px;margin:auto;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px}label{font-size:0.7rem;color:#ffd166;display:block;margin-top:8px}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;margin-top:4px}button{width:100%;padding:13px;background:#00f5d4;color:#000;font-weight:bold;border:none;border-radius:8px;margin-top:12px}</style></head><body><div class="box"><h2 style="color:#00f5d4;text-align:center" class="notranslate">🌙 SENDA - Turno</h2><div id="form"><label>Apellidos *</label><input id="apellidos"><label>Nombres *</label><input id="nombres"><label>DNI *</label><input id="dni"><label>Obra Social *</label><select id="os" onchange="checkOS()"><option>PARTICULAR</option><option>OSDE</option><option>SWISS MEDICAL</option><option>GALENO</option><option>MEDICUS</option><option>OMINT</option><option>IOMA</option><option>PAMI</option><option>OTRA</option></select><input id="os_otra" style="display:none" placeholder="¿Cuál?"><label>WhatsApp *</label><input id="tel"><label>Tipo estudio *</label><select id="tipo" onchange="cambiarHoras()"><option value="EEG">EEG 21-22 / 22-23</option><option value="PSG_BASAL">PSG Basal 21-23 / 23-01 / 01-03 / 03-05</option><option value="PSG_RESP" selected>PSG Resp / Apneas - 23-05 (6hs)</option></select><label>Fecha Lun Mar Jue *</label><input type="date" id="fecha" onchange="validarDia()"><div id="avisoDia" style="min-height:18px;font-size:0.8rem"></div><label>Bloque *</label><select id="hora"></select><button id="btn" onclick="enviar()" class="notranslate">Reservar Noche</button></div></div></body></html>
