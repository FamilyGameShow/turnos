<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Turno - Senda Comunidad</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.toggleSeccionOrden = function() {
            const tieneOrden = document.getElementById('selectTieneOrden').value;
            const seccionSubir = document.getElementById('seccionSubirOrden');
            const seccionDatosSinOrden = document.getElementById('seccionDatosSinOrden');

            if (tieneOrden === "si") {
                seccionSubir.style.display = "block";
                seccionDatosSinOrden.style.display = "none";
            } else if (tieneOrden === "no") {
                seccionSubir.style.display = "none";
                seccionDatosSinOrden.style.display = "block";
            } else {
                seccionSubir.style.display = "none";
                seccionDatosSinOrden.style.display = "none";
            }
        };

        window.enviarSolicitud = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            btn.innerText = "Enviando solicitud...";
            btn.disabled = true;

            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const tieneOrden = document.getElementById('selectTieneOrden').value;
            const esDomicilio = document.getElementById('checkDomicilio').checked;

            if (!tieneOrden) {
                alert("Por favor indicá si tenés orden médica.");
                btn.innerText = "Solicitar Turno";
                btn.disabled = false;
                return;
            }

            let ordenUrl = "";
            let conOrden = (tieneOrden === "si");

            try {
                if (conOrden) {
                    const archivoInput = document.getElementById('archivoOrden');
                    if (archivoInput.files.length > 0) {
                        const file = archivoInput.files[0];
                        const storageRef = ref(storage, `ordenes/${Date.now()}_${file.name}`);
                        const snapshot = await uploadBytes(storageRef, file);
                        ordenUrl = await getDownloadURL(snapshot.ref);
                    }
                }

                await addDoc(collection(db, "solicitudes_turnos"), {
                    nombre_paciente: nombre,
                    telefono: telefono,
                    con_orden: conOrden,
                    orden_url: ordenUrl,
                    edad: document.getElementById('edad').value || "",
                    motivo: document.getElementById('motivo').value || "",
                    obra_social: document.getElementById('obraSocial').value || "",
                    es_domicilio: esDomicilio,
                    fecha_solicitud: new Date().toISOString()
                });

                document.getElementById('formTurno').style.display = "none";
                document.getElementById('mensajeExito').style.display = "block";

            } catch (error) {
                alert("Error al enviar: " + error.message);
                btn.innerText = "Solicitar Turno";
                btn.disabled = false;
            }
        };

        window.enviarSolicitudForm = enviarSolicitud;
    </script>
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --cyan: #00f5d4; --gold: #ffd166; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background: var(--dark); color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--card); border: 1px solid #334155; padding: 25px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; color: var(--cyan); text-align: center; text-transform: uppercase; margin-bottom: 20px; }
        label { font-size: 0.85rem; color: #94a3b8; font-weight: bold; display: block; margin-top: 12px; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; font-size: 0.9rem; }
        .checkbox-box { display: flex; align-items: center; gap: 10px; margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; cursor: pointer; }
        .checkbox-box input { width: 18px; height: 18px; accent-color: var(--cyan); }
        .btn { width: 100%; background: var(--cyan); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 20px; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; }
        #mensajeExito { display: none; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Senda Comunidad<br><span style="font-size:0.8rem; color:#fff;">Solicitud de Turno</span></h1>
        
        <form id="formTurno" onsubmit="enviarSolicitudForm(event)">
            <label>Nombre y Apellido:</label>
            <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">

            <label>Teléfono (WhatsApp):</label>
            <input type="tel" id="telefono" required placeholder="Ej: 2214567890">

            <!-- LO PRIMERO: PREGUNTAR SI TIENE ORDEN ANTES DE LO DEMÁS -->
            <label>¿Tenés orden médica?</label>
            <select id="selectTieneOrden" onchange="toggleSeccionOrden()" required>
                <option value="">-- Seleccioná una opción --</option>
                <option value="si">Sí, tengo la orden</option>
                <option value="no">No tengo / Es particular</option>
            </select>

            <!-- OPCIÓN A: SI TIENE ORDEN, SUBE LA FOTO -->
            <div id="seccionSubirOrden" style="display:none; margin-top: 10px;">
                <label>Subir foto de la orden médica:</label>
                <input type="file" id="archivoOrden" accept="image/*">
            </div>

            <!-- OPCIÓN B: SI NO TIENE ORDEN, PIDE LOS DATOS EXTRAS -->
            <div id="seccionDatosSinOrden" style="display:none; margin-top: 10px;">
                <label>Edad:</label>
                <input type="number" id="edad" placeholder="Ej: 45">

                <label>Motivo del estudio:</label>
                <input type="text" id="motivo" placeholder="Ej: Ronquidos / Apneas">

                <label>Obra Social (si tiene):</label>
                <input type="text" id="obraSocial" placeholder="Ej: IOMA, PAMI, Particular...">
            </div>

            <!-- OPCIÓN DE DOMICILIO -->
            <label class="checkbox-box">
                <input type="checkbox" id="checkDomicilio">
                <span>¿El estudio es a domicilio? 🏠</span>
            </label>

            <button type="submit" id="btnEnviar" class="btn">Solicitar Turno</button>
        </form>

        <div id="mensajeExito">
            <h3 style="color: var(--cyan); margin-bottom: 10px;">¡Solicitud Enviada!</h3>
            <p style="font-size: 0.9rem; color: #cbd5e1;">Nos vamos a comunicar con vos por WhatsApp a la brevedad para confirmarte el día y la hora de tu estudio.</p>
        </div>
    </div>
</body>
</html>
