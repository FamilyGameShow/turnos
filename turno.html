<!DOCTYPE html><html lang="es" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SENDA</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(cfg);const db=getFirestore(app);
window.validarDia=()=>{let f=document.getElementById('fecha').value;if(!f)return;let d=new Date(f+'T12:00:00');let dia=d.getDay();let nombre=['DOM','LUN','MAR','MIE','JUE','VIE','SAB'][dia];document.getElementById('avisoDia').innerText='Elegiste: '+nombre+' '+f;if(dia!==1&&dia!==2&&dia!==4){document.getElementById('avisoDia').innerHTML='<b style="color:#ef4444">❌ NO atendemos '+nombre+'. Solo LUNES, MARTES y JUEVES noche. No hay Viernes.</b>';document.getElementById('btn').disabled=true;document.getElementById('btn').style.opacity='0.3';}else{document.getElementById('avisoDia').innerHTML='<b style="color:#10b981">✅ '+ (dia==1?'NOCHE DEL LUNES':dia==2?'NOCHE DEL MARTES':'NOCHE DEL JUEVES')+' - Disponible</b>';document.getElementById('btn').disabled=false;document.getElementById('btn').style.opacity='1';}};
window.enviar=async()=>{
 let fecha=document.getElementById('fecha').value;let d=new Date(fecha+'T12:00:00');let dia=d.getDay();if(dia!==1&&dia!==2&&dia!==4){alert('Solo LUNES, MARTES y JUEVES noche. No hay viernes. Cambiá la fecha.');return;}
 let snap=await getDocs(collection(db,"pacientes_senda"));let ocupado=false;snap.forEach(x=>{if(x.data().fecha===fecha)ocupado=true});if(ocupado){alert('Esa noche ya está ocupada');return;}
 let data={nro_estudio:'PSG'+Date.now().toString().slice(-6),apellidos:document.getElementById('apellidos').value.toUpperCase(),nombres:document.getElementById('nombres').value.toUpperCase(),dni:document.getElementById('dni').value,obra_social:document.getElementById('os').value,telefono:document.getElementById('tel').value,fecha:fecha,hora:document.getElementById('hora').value,noche:dia==1?'NOCHE DEL LUNES':dia==2?'NOCHE DEL MARTES':'NOCHE DEL JUEVES',lugar:'SENDA',tipo_estudio:'PSG NOCTURNO',estado:'NUEVO',creado:new Date().toISOString()};
 await addDoc(collection(db,"pacientes_senda"),data);
 document.getElementById('form').innerHTML='<div style="background:#10b981;color:#000;padding:20px;border-radius:10px;text-align:center"><h2>✅ Turno pedido</h2><p><b>'+data.noche+' '+data.fecha+'</b></p><p>'+data.nro_estudio+'</p><p style="font-size:0.7rem">Si dice LUNES 03hs es lunes de noche, madrugada del martes.</p></div>';
};
</script><style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:12px}.box{max-width:500px;margin:auto;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px}label{font-size:0.7rem;color:#ffd166;display:block;margin-top:8px}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;margin-top:4px}button{width:100%;padding:12px;background:#00f5d4;color:#000;font-weight:bold;border:none;border-radius:8px;margin-top:12px}</style></head><body><div class="box"><h2 style="color:#00f5d4;text-align:center" class="notranslate">🌙 SENDA - Lun Mar Jue Noche</h2><div style="background:#0f172a;border:1px dashed #00f5d4;padding:8px;border-radius:8px;font-size:0.7rem;color:#94a3b8">Solo NOCHE LUNES, MARTES, JUEVES. NO viernes. Lunes 03hs = lunes noche, madrugada martes.</div><div id="form"><label>Apellidos</label><input id="apellidos"><label>Nombres</label><input id="nombres"><label>DNI</label><input id="dni"><label>OS</label><input id="os" value="PARTICULAR"><label>Tel</label><input id="tel"><label>Fecha</label><input type="date" id="fecha" onchange="validarDia()"><div id="avisoDia" style="font-size:0.8rem;margin-top:6px;min-height:20px"></div><label>Hora</label><select id="hora"><option>22:00</option><option>22:30</option><option>23:00</option></select><button id="btn" onclick="enviar()" class="notranslate">Reservar Noche</button></div></div></body></html>
