<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENDA Turno v16 FIX</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(cfg); const db=getFirestore(app);

const OS_INFO={'IOMA':'IOMA: NO requiere autorización si es la 1ra del año. Diferenciado $15.000.','OSDE':'OSDE: Lo autorizamos nosotros con token. Sin diferenciado.','OSPE':'OSPE: Lo autoriza el paciente por web de OSPE. Sin diferenciado.','OSPE PMO':'OSPE PMO: Se autoriza en Instituto Central de Medicina. Sin diferenciado.','SWISS MEDICAL':'SWISS MEDICAL: No requiere autorización. Sin diferenciado.','GALENO':'GALENO: Autoriza el afiliado. Sin costo.','MEDICUS':'MEDICUS: No requiere autorización.','OMINT':'OMINT: No requiere autorización.','PAMI':'PAMI: NO trabajamos. Se toma como PARTICULAR.','PARTICULAR':'','OTRA':'Traer orden + carnet.'};
const PRECIOS={'EEG':'$100.000','PSG_BASAL':'$150.000','PSG_DIURNA':'$150.000','PSG_NOCTURNA':'$200.000','PSG_RESP':'$350.000'};
let ordenB64="";

window.toggleOrden=()=>{document.getElementById('boxOrden').style.display=document.getElementById('tieneOrden').value=='SI'?'block':'none';}
window.mostrarInfo=()=>{
 let os=document.getElementById('os').value; let tipo=document.getElementById('tipo').value;
 let div=document.getElementById('infoOS'); let html='';
 if(OS_INFO[os]) html+=`<div style="background:#fff3cd;border:1px solid #f59e0b;padding:10px;border-radius:10px;color:#000;font-size:0.84rem;font-weight:700">${OS_INFO[os]}</div>`;
 if(os=='IOMA') html+=`<div style="background:#000;color:#ffd166;padding:8px;border-radius:8px;margin-top:6px;font-weight:800">Diferenciado: $15.000</div>`;
 if(os=='PARTICULAR'){
   let precio=PRECIOS[tipo]||'';
   if(precio) html+=`<div style="background:#000;color:#00f5d4;padding:12px;border-radius:10px;margin-top:8px;font-weight:900;font-size:1.1rem;text-align:center">ESTE ESTUDIO PARTICULAR: ${precio}<br><span style="font-size:0.8rem;color:#fff">Se abona el día del estudio</span></div>`;
 }
 if(os!='PARTICULAR' && os!='PAMI' && os!='OTRA' && os) html+=`<div style="background:#000;color:#22c55e;padding:7px;border-radius:8px;margin-top:6px;font-weight:700;font-size:0.8rem">Costo: $0 (sin diferenciado)</div>`;
 div.innerHTML=html;
}
window.leerOrden=(i)=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{ordenB64=e.target.result;document.getElementById('avisoOrden').innerHTML='✅ Orden cargada'};r.readAsDataURL(f);}

const BLOQUES={'21:00-22:00':[21,22],'22:00-23:00':[22,23],'21:00-23:00':[21,23],'23:00-01:00':[23,25],'01:00-03:00':[25,27],'03:00-05:00':[27,29],'23:00-05:00':[23,29],'10:00-13:00':[10,13]};
function choque(n,exs){let a=BLOQUES[n]||[0,0];for(let ex of exs){if(ex.estado=='CANCELADO')continue;let b=BLOQUES[ex.hora]||[0,0];if(a[0]<b[1]&&b[0]<a[1])return ex;}return null;}

window.cambiarHoras=async()=>{
 let t=document.getElementById('tipo').value;
 let sel=document.getElementById('hora');
 let fecha=document.getElementById('fecha').value;
 // LOGICA HORARIOS CORREGIDA
 let ops=[];
 if(t=='EEG'){ ops=['21:00-22:00','22:00-23:00']; }
 else if(t=='PSG_BASAL'){ ops=['21:00-23:00','23:00-01:00','01:00-03:00','03:00-05:00']; }
 else if(t=='PSG_DIURNA'){ ops=['10:00-13:00']; }
 else { ops=['23:00-05:00']; } // NOCTURNA y RESPIRATORIA

 let ocup=[];
 if(fecha){try{let q=query(collection(db,"pacientes_senda"),where("fecha","==",fecha));let s=await getDocs(q);s.forEach(d=>ocup.push(d.data()));}catch(e){}}
 sel.innerHTML='';
 for(let op of ops){
   let ch=choque(op,ocup);
   let o=document.createElement('option');
   o.value=op; o.text=ch?op+' ❌ OCUPADO por '+ (ch.apellidos||'') : op + ' ✅ Libre';
   if(ch) o.disabled=true;
   sel.appendChild(o);
 }
 mostrarInfo();
}
window.validarDia=()=>{let f=document.getElementById('fecha').value;if(!f)return;let dia=new Date(f+'T12:00:00').getDay();let b=document.getElementById('btn'),av=document.getElementById('aviso');if(dia!=1&&dia!=2&&dia!=4){av.innerHTML='❌ Solo LUN MAR JUE';b.disabled=true;}else{av.innerHTML='✅ '+(dia==1?'LUNES':dia==2?'MARTES':'JUEVES');b.disabled=false;cambiarHoras();}}

window.enviar=async()=>{
 let ap=document.getElementById('ap').value.toUpperCase().trim(),no=document.getElementById('no').value.toUpperCase().trim(),dni=document.getElementById('dni').value.trim(),tel=document.getElementById('tel').value.trim(),os=document.getElementById('os').value,fecha=document.getElementById('fecha').value,hora=document.getElementById('hora').value,tipo=document.getElementById('tipo').value,tiene=document.getElementById('tieneOrden').value;
 if(!ap||!no||!dni||!fecha||!tel){alert('Faltan datos');return;} if(tiene=='SI'&&!ordenB64){alert('Subí foto de orden');return;}
 document.getElementById('btn').innerHTML='Verificando...'; document.getElementById('btn').disabled=true;
 let q=query(collection(db,"pacientes_senda"),where("fecha","==",fecha));let snap=await getDocs(q);let exs=[];snap.forEach(s=>exs.push(s.data()));let ch=choque(hora,exs);
 if(ch){alert('Ocupado por '+ch.apellidos);document.getElementById('btn').innerHTML='Solicitar';document.getElementById('btn').disabled=false;return;}
 try{
  let d=new Date(fecha+'T12:00:00'),noche=d.getDay()==1?'LUNES':d.getDay()==2?'MARTES':'JUEVES',diaNum=fecha.split('-')[2]+'/'+fecha.split('-')[1];
  let costoTxt=os=='PARTICULAR'?PRECIOS[tipo]:os=='IOMA'?'$15.000':'$0';
  let infoTxt=OS_INFO[os]||''; if(os=='PARTICULAR') infoTxt='PARTICULAR '+costoTxt;
  let data={apellidos:ap,nombres:no,dni:dni,telefono:tel,obra_social:os,fecha:fecha,hora:hora,tipo_estudio:tipo,noche:noche,orden_base64:ordenB64,tiene_orden:tiene=='SI',estado:tiene=='SI'?'PRE-RESERVA':'FALTA_ORDEN',creado:new Date().toISOString(),costo:costoTxt};
  let docRef=await addDoc(collection(db,"pacientes_senda"),data);
  let w=window.open('','','width=800,height=950');
  w.document.write(`<html><head><meta charset="UTF-8"><title>TURNO</title></head><body style="margin:0;background:#2ecc71;padding:10px;font-family:Arial"><div style="max-width:700px;margin:auto;background:white;border:3px solid black"><div style="display:flex;justify-content:space-between;padding:10px;border-bottom:3px solid #000"><b>SENDA COMUNIDAD</b><b style="font-size:22px">TURNO</b></div><div style="border:3px solid #000;margin:8px;padding:10px;font-size:20px;font-weight:800">DIA: ${noche} ${diaNum} - ${tipo}</div><div style="border:3px solid #000;margin:8px;padding:10px;font-size:20px;font-weight:800;text-align:center">HORA: ${hora} - ${ap} ${no}</div><div style="border:3px solid #000;margin:8px;padding:10px;font-size:14px;font-weight:700">LUGAR: 56 N°1321 e/21 y 22<br>OS: ${os} - ${infoTxt}<br>COSTO: ${costoTxt} - DNI ${dni}</div><div style="border:2px solid red;margin:8px;padding:8px;text-align:center;font-size:12px">Pelo lavado seco sin crema - sin esmalte - privacion sueno<br>Orden autorizada (IOMA NO REQUIERE SI ES 1RA)<br>TEL 2215983871</div></div><div style="text-align:center;margin-top:10px"><button onclick="window.print()" style="padding:14px 28px;background:#000;color:#fff;font-weight:900;border:none">IMPRIMIR / GUARDAR PDF</button></div></body></html>`);
  location.reload();
 }catch(e){alert(e.message);document.getElementById('btn').disabled=false;}
}
window.onload=()=>{cambiarHoras();toggleOrden();mostrarInfo();};
</script>
<style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px}.box{max-width:560px;margin:auto;background:#1e293b;padding:20px;border-radius:20px}input,select{width:100%;padding:13px;border-radius:11px;background:#0f172a;border:1px solid #334155;color:#fff;margin-top:5px}label{font-size:0.72rem;color:#ffd166;margin-top:12px;display:block;font-weight:800}#boxOrden{background:#0f172a;border:1px dashed #f59e0b;padding:10px;border-radius:10px;margin-top:6px}</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#00f5d4;margin:0">SENDA Turno v16 FIX</h2>
<label>Apellidos</label><input id="ap"><label>Nombres</label><input id="no"><label>DNI</label><input id="dni"><label>WhatsApp</label><input id="tel">
<label>Obra Social</label><select id="os" onchange="mostrarInfo()"><option>PARTICULAR</option><option>IOMA</option><option>OSDE</option><option>OSPE</option><option>OSPE PMO</option><option>SWISS MEDICAL</option><option>GALENO</option><option>MEDICUS</option><option>OMINT</option><option>PAMI</option><option>OTRA</option></select>
<label>Tipo de estudio (sin IMG)</label><select id="tipo" onchange="cambiarHoras()"><option value="EEG">EEG</option><option value="PSG_BASAL">PSG BASAL</option><option value="PSG_DIURNA">PSG DIURNA</option><option value="PSG_NOCTURNA">PSG NOCTURNA</option><option value="PSG_RESP" selected>PSG RESPIRATORIA con oximetria</option></select>
<div id="infoOS" style="margin-top:10px"></div>
<label>¿Tenés orden?</label><select id="tieneOrden" onchange="toggleOrden()"><option value="SI">SI</option><option value="NO">NO, LA LLEVO EL DIA</option></select>
<div id="boxOrden"><input type="file" accept="image/*" capture="environment" onchange="leerOrden(this)"><div id="avisoOrden" style="font-size:0.8rem;color:#00f5d4"></div></div>
<label>Fecha (Lun Mar Jue)</label><input type="date" id="fecha" onchange="validarDia()"><div id="aviso"></div>
<label>Bloque horario (cambia según estudio)</label><select id="hora"></select>
<button id="btn" onclick="enviar()" style="width:100%;padding:14px;margin-top:14px;background:#00f5d4;color:#000;font-weight:900;border:none;border-radius:12px">Solicitar Turno</button>
</div>
</body>
</html>
