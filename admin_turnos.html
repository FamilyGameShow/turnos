<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Agenda e Inteligencia Senda</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, doc, deleteDoc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "ecaea9952d943c3b43e17626fe47f766";

        let pacienteSeleccionado = null;
        let fechaActualCalendario = new Date();

        window.addEventListener('DOMContentLoaded', () => {
            escucharSolicitudes();
            renderizarCalendario();
        });

        // 1. ESCUCHAR SOLICITUDES DE PACIENTES
        function escucharSolicitudes() {
            onSnapshot(collection(db, "solicitudes_turnos"), (snapshot) => {
                const contenedor = document.getElementById('listaTurnos');
                contenedor.innerHTML = "";
                
                if (snapshot.empty) {
                    contenedor.innerHTML = "<p style='color:#94a3b8; text-align:center;'>No hay solicitudes pendientes.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    let t = docSnap.data();
                    let id = docSnap.id;

                    let detalleExtra = t.con_orden && t.orden_url ? 
                        `<a href="${t.orden_url}" target="_blank" style="color:var(--cyan); font-size:0.8rem; display:block; margin-bottom:10px;">📄 Ver Orden Médica</a>` : 
                        `<div style="font-size:0.75rem; color:#cbd5e1; background:#0f172a; padding:6px; border-radius:6px; margin-bottom:8px;">Edad: ${t.edad || '-'} | Motivo: ${t.motivo || '-'} | OS: ${t.obra_social || '-'}</div>`;

                    let div = document.createElement('div');
                    div.className = "card-turno";
                    div.innerHTML = `
                        <div style="font-weight:bold; color:var(--gold); font-size:0.95rem;">${t.nombre_paciente}</div>
                        <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:6px;">📱 ${t.telefono}</div>
                        ${detalleExtra}
                        <button class="btn-accion" style="background:var(--cyan); color:#000;" onclick='prepararAsignacion(${JSON.stringify({id, ...t})})'>Asignar Turno 📅</button>
                    `;
                    contenedor.appendChild(div);
                });
            });
        }

        window.prepararAsignacion = function(paciente) {
            pacienteSeleccionado = paciente;
            document.getElementById('lblPacienteAsignando').innerText = `Asignando a: ${paciente.nombre_paciente} (${paciente.telefono})`;
            document.getElementById('panelAsignacion').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 2. RENDERIZAR CALENDARIO MES A MES (TIPO TABLERO)
        async function renderizarCalendario() {
            const grid = document.getElementById('gridCalendario');
            const lblMes = document.getElementById('lblMesAnio');
            grid.innerHTML = "";

            let anio = fechaActualCalendario.getFullYear();
            let mes = fechaActualCalendario.getMonth(); // 0 a 11

            const nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            lblMes.innerText = `${nombresMeses[mes]} ${anio}`;

            let primerDiaIndex = new Date(anio, mes, 1).getDay(); // Día de la semana
            let totalDiasMes = new Date(anio, mes + 1, 0).getDate();

            // Ajustar para que la semana empiece en Lunes (1)
            primerDiaIndex = primerDiaIndex === 0 ? 6 : primerDiaIndex - 1;

            // Rellenar espacios vacíos previos al 1 del mes
            for (let i = 0; i < primerDiaIndex; i++) {
                let vacio = document.createElement('div');
                vacio.className = "dia-celda vacia";
                grid.appendChild(vacio);
            }

            // Cargar estados guardados en Firebase para este mes
            for (let dia = 1; dia <= totalDiasMes; dia++) {
                let mesStr = String(mes + 1).padStart(2, '0');
                let diaStr = String(dia).padStart(2, '0');
                let idDoc = `${anio}-${mesStr}-${diaStr}`;

                let celda = document.createElement('div');
                celda.className = "dia-celda";
                celda.innerText = dia;
                celda.dataset.fecha = idDoc;

                // Consultar estado en Firebase
                let docSnap = await getDoc(doc(db, "agenda_estados", idDoc));
                if (docSnap.exists()) {
                    let datos = docSnap.data();
                    celda.classList.add(datos.claseColor); // ej: 'ocupado-2hs', 'ocupado-6hs', 'bloque-personal'
                    celda.title = datos.detalle || '';
                }

                celda.onclick = () => manejarClickCelda(idDoc, celda);
                grid.appendChild(celda);
            }
        }

        window.cambiarMes = function(dir) {
            fechaActualCalendario.setMonth(fechaActualCalendario.getMonth() + dir);
            renderizarCalendario();
        };

        // 3. INTERACCIÓN CON EL TABLERO (MARCAR DÍAS / BLOQUEOS PERSONALES)
        window.manejarClickCelda = async function(idFecha, elementoCelda) {
            if (pacienteSeleccionado) {
                // Si hay un paciente seleccionado, abrir selector de horario para este día
                document.getElementById('inputFechaElegida').value = idFecha;
                document.getElementById('selectorHorasBox').style.display = "block";
            } else {
                // Si NO hay paciente, usar para bloqueo personal (Vacaciones, Banda, Enfermo, etc.)
                let accion = prompt(`Fecha: ${idFecha}\nElegí el estado:\n1. Libre (Borrar)\n2. Vacaciones / Personal 🌴\n3. Banda 🎸\n4. Enfermo 🤒`, "2");
                if (!accion) return;

                let claseColor = "";
                let detalle = "";
                if (accion === "1") {
                    await setDoc(doc(db, "agenda_estados", idFecha), { claseColor: "", detalle: "" });
                    elementoCelda.className = "dia-celda";
                    return;
                } else if (accion === "2") { claseColor = "bloque-personal"; detalle = "Vacaciones / Personal"; }
                else if (accion === "3") { claseColor = "bloque-banda"; detalle = "Toque con la Banda"; }
                else if (accion === "4") { claseColor = "bloque-enfermo"; detalle = "Enfermo / Descanso"; }

                await setDoc(doc(db, "agenda_estados", idFecha), { claseColor, detalle });
                renderizarCalendario();
            }
        };

        // 4. CONFIRMAR TURNO Y GENERAR IMAGEN / WSP
        window.confirmarAsignacionFinal = async function() {
            const fechaId = document.getElementById('inputFechaElegida').value;
            const tipoEstudio = document.getElementById('selectTipoEstudio').value;
            const horaBloque = document.getElementById('selectHoraBloque').value;

            if (!fechaId || !tipoEstudio || !horaBloque) {
                alert("Completá todos los datos de asignación.");
                return;
            }

            let [anio, mes, dia] = fechaId.split('-');
            let d = new Date(anio, mes - 1, dia);
            let diasSemana = ['DOMINGO', 'LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO'];
            let diaHoraFinal = `${diasSemana[d.getDay()]} ${dia}/${mes} a las ${horaBloque}`;
            let { id, telefono, nombre_paciente } = pacienteSeleccionado;

            // Dibujar Tarjeta en Canvas para ImgBB
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 1000;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#009688"; ctx.fillRect(0, 0, canvas.width, 90);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 28px sans-serif"; ctx.fillText("SENDA COMUNIDAD", 40, 42);
            ctx.font = "18px sans-serif"; ctx.fillText("CENTRO DE ESTUDIOS DEL SUEÑO", 40, 70);

            ctx.fillStyle = "#111827"; ctx.font = "bold 26px sans-serif"; ctx.fillText(`TURNO PARA ${tipoEstudio}`, 40, 150);
            ctx.strokeStyle = "#009688"; ctx.lineWidth = 3; ctx.strokeRect(40, 180, 720, 120);
            ctx.font = "bold 22px sans-serif"; ctx.fillText(`PACIENTE: ${nombre_paciente}`, 70, 230);
            ctx.fillText(`DIA: ${diaHoraFinal}`, 70, 270);

            ctx.font = "bold 20px sans-serif"; ctx.fillText("LUGAR: 56 N° 1321 e/ 21 y 22", 40, 350);
            ctx.font = "16px sans-serif"; ctx.fillStyle = "#374151"; ctx.fillText("En caso de no poder concurrir avisar con anticipacion para cambiar el turno.", 40, 390);

            ctx.strokeStyle = "#dc2626"; ctx.strokeRect(40, 420, 720, 250);
            ctx.fillStyle = "#dc2626"; ctx.font = "bold 20px sans-serif"; ctx.fillText("El dia del estudio:", 70, 460);
            ctx.fillStyle = "#111827"; ctx.font = "18px sans-serif";
            ctx.fillText("- El pelo lavado, pero seco, sin crema de enjuague ni otros productos.", 70, 505);
            ctx.fillText("- Sin esmalte de uñas.", 70, 545);
            ctx.fillText("- Privación de sueño suficiente como para dormir en el consultorio.", 70, 585);
            ctx.fillText("- Orden autorizada por obra social (IOMA NO REQUIERE AUTORIZACION).", 70, 625);

            ctx.font = "bold 16px sans-serif"; ctx.fillText("EL INFORME SERA ENVIADO DENTRO DE LOS 10 A 15 DIAS, EN FORMATO PDF,", 40, 730);
            ctx.fillText("POR FAVOR IMPRIMIRLO POR SI SE BORRA DE LOS MENSAJES.", 40, 760);
            ctx.font = "bold 22px sans-serif"; ctx.fillStyle = "#009688"; ctx.fillText("TEL: 2215983871", 40, 830);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append("image", blob, `Turno_${nombre_paciente}.png`);
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const resultado = await response.json();
                if (!resultado.success) throw new Error("Error al subir imagen.");

                const urlImagen = resultado.data.url;

                // Guardar color en el tablero según duración (2hs o 6hs)
                let claseColor = tipoEstudio.includes("LARGO") ? "ocupado-6hs" : "ocupado-2hs";
                await setDoc(doc(db, "agenda_estados", fechaId), { claseColor, detalle: `${nombre_paciente} (${tipoEstudio})` });

                // Abrir WhatsApp con el link
                let mensajeWsp = `Hola ${nombre_paciente}! Te escribimos de Estudios del Sueño. Acá tenés tu comprobante (${diaHoraFinal}):\n\n${urlImagen}\n\n¡Te esperamos!`;
                window.open(`https://wa.me/549${telefono}?text=${encodeURIComponent(mensajeWsp)}`, '_blank');

                // Borrar solicitud pendiente
                await deleteDoc(doc(db, "solicitudes_turnos", id));
                document.getElementById('panelAsignacion').style.display = "none";
                pacienteSeleccionado = null;
                renderizarCalendario();
            }, 'image/png');
        };
    </script>
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --cyan: #00f5d4; --gold: #ffd166; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background: var(--dark); color: #fff; padding: 15px; }
        .container { max-width: 650px; margin: 0 auto; }
        h1 { font-size: 1.3rem; color: var(--cyan); text-align: center; text-transform: uppercase; margin-bottom: 15px; }
        
        .card-turno { background: var(--card); border: 1px solid #334155; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        .btn-accion { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; margin-top: 5px; }

        /* Estilo Calendario Tablero */
        .calendario-box { background: var(--card); border: 1px solid #334155; padding: 15px; border-radius: 12px; margin-top: 20px; }
        .header-calendario { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .grid-dias-semana { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; color: #94a3b8; font-weight: bold; margin-bottom: 6px; }
        .grid-mes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .dia-celda { background: #0f172a; border: 1px solid #334155; height: 50px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; cursor: pointer; position: relative; font-weight: bold; }
        .dia-celda.vacia { background: transparent; border: none; cursor: default; }
        
        /* Colores de Estado del Tablero */
        .ocupado-2hs { background: #1e3a8a !important; border-color: #3b82f6 !important; color: #93c5fd; }
        .ocupado-6hs { background: #064e3b !important; border-color: #10b981 !important; color: #6ee7b7; }
        .bloque-personal { background: #7c2d12 !important; border-color: #f97316 !important; color: #fdba74; }
        .bloque-banda { background: #581c87 !important; border-color: #a855f7 !important; color: #d8b4fe; }
        .bloque-enfermo { background: #831843 !important; border-color: #ec4899 !important; color: #fbcfe8; }

        /* Panel de Asignación Activa */
        #panelAsignacion { background: #1e293b; border: 2px solid var(--gold); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; }
        label { font-size: 0.8rem; color: #94a3b8; font-weight: bold; display: block; margin-top: 8px; }
        select, input { width: 100%; padding: 8px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Panel de Solicitudes y Agenda</h1>

        <!-- PANEL FLOTANTE CUANDO ELEGIMOS UN PACIENTE A ASIGNAR -->
        <div id="panelAsignacion">
            <h3 id="lblPacienteAsignando" style="color: var(--gold); font-size: 0.95rem; margin-bottom: 8px;"></h3>
            <p style="font-size: 0.8rem; color: #cbd5e1;">Paso 1: Tocá un día en el calendario de abajo para seleccionarlo.</p>
            
            <div id="selectorHorasBox" style="display:none; margin-top: 10px; background: #0f172a; padding: 10px; border-radius: 8px;">
                <label>Fecha Seleccionada:</label>
                <input type="text" id="inputFechaElegida" readonly style="background: #1e293b;">

                <label>Tipo de Estudio:</label>
                <select id="selectTipoEstudio">
                    <option value="ESTUDIO NEUROLÓGICO (2hs)">Estudio Neurológico (2hs)</option>
                    <option value="ESTUDIO LARGO / APNEAS (6hs)">Estudio Largo / Apneas (6hs)</option>
                </select>

                <label>Bloque Horario de la Noche:</label>
                <select id="selectHoraBloque">
                    <option value="21hs">21:00 hs</option>
                    <option value="23hs">23:00 hs</option>
                    <option value="01hs">01:00 hs (Madrugada)</option>
                    <option value="03hs">03:00 hs (Madrugada)</option>
                </select>

                <button class="btn-accion" style="background: var(--cyan); color: #000; width: 100%; margin-top: 10px;" onclick="confirmarAsignacionFinal()">Generar Imagen y Enviar WhatsApp 🚀</button>
            </div>
        </div>

        <!-- LISTA DE SOLICITUDES DE PACIENTES -->
        <div style="margin-bottom: 20px;">
            <h3 style="font-size: 1rem; color: var(--cyan); margin-bottom: 8px;">Solicitudes Pendientes</h3>
            <div id="listaTurnos"></div>
        </div>

        <!-- TABLEROS / CALENDARIO MENSUAL INTERACTIVO -->
        <div class="calendario-box">
            <div class="header-calendario">
                <button class="btn-accion" style="background:#334155;" onclick="cambiarMes(-1)">◀ Mes Ant</button>
                <h3 id="lblMesAnio" style="color: var(--gold); font-size: 1rem;"></h3>
                <button class="btn-accion" style="background:#334155;" onclick="cambiarMes(1)">Mes Sig ▶</button>
            </div>
            <div class="grid-dias-semana">
                <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
            </div>
            <div id="gridCalendario" class="grid-mes"></div>
            <p style="font-size: 0.7rem; color: #94a3b8; text-align: center; margin-top: 12px;">💡 Tip: Tocá cualquier día sin seleccionar paciente para bloquearlo por vacaciones, banda o enfermedad.</p>
        </div>
    </div>
</body>
</html>
