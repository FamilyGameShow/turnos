<!DOCTYPE html><html lang="es" class="notranslate"><head><meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SENDA Admin</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(cfg);const db=getFirestore(app);
window.cambiarHoras=()=>{
 let tipo=document.getElementById('tipo').value;let sel=document.getElementById('hora');sel.innerHTML='';
 if(tipo=='EEG'){sel.innerHTML='<option value="21:00-22:00">21:00 a 22:00</option><option value="22:00-23:00" selected>22:00 a 23:00</option>';}
 else if(tipo=='PSG_BASAL'){sel.innerHTML='<option value="21:00-23:00">21:00 a 23:00</option><option value="23:00-01:00">23:00 a 01:00</option><option value="01:00-03:00">01:00 a 03:00</option><option value="03:00-05:00">03:00 a 05:00</option>';}
 else{sel.innerHTML='<option value="23:00-05:00" selected>23:00 a 05:00 - 6hs</option><option value="21:00-23:00">21:00 a 23:00</option><option value="23:00-01:00">23:00 a 01:00</option>';}
}
window.validarDia=()=>{let f=document.getElementById('fecha').value;if(!f)return;let d=new Date(f+'T12:00:00');let dia=d.getDay();let btn=document.getElementById('btn');let txt=document.getElementById('aviso');if(dia!==1&&dia!==2&&dia!==4){txt.innerHTML='❌ Solo LUN MAR JUE';btn.disabled=true;btn.style.opacity='0.3';}else{txt.innerHTML='✅ '+(dia==1?'LUNES NOCHE':dia==2?'MARTES NOCHE':'JUEVES NOCHE');btn.disabled=false;btn.style.opacity='1';}}
window.crear=async()=>{
 let ap=document.getElementById('ap').value.toUpperCase();let no=document.getElementById('no').value.toUpperCase();let dni=document.getElementById('dni').value;let fecha=document.getElementById('fecha').value;let hora=document.getElementById('hora').value;let tipo=document.getElementById('tipo').value;let os=document.getElementById('os').value;
 if(!ap||!no||!dni||!fecha){alert('Falta dato');return;}
 let d=new Date(fecha+'T12:00:00');if(d.getDay()!==1&&d.getDay()!==2&&d.getDay()!==4){alert('Solo Lun Mar Jue');return;}
 let data={apellidos:ap,nombres:no,dni:dni,obra_social:os,fecha:fecha,hora:hora,tipo_estudio:tipo,noche:d.getDay()==1?'LUNES':d.getDay()==2?'MARTES':'JUEVES',estado:'CONFIRMADO',creado:new Date().toISOString()};
 await addDoc(collection(db,"pacientes_senda"),data);alert('Guardado '+fecha+' '+hora);location.reload();
}
window.onload=()=>{cambiarHoras(); cargar();};
async function cargar(){let snap=await getDocs(collection(db,"pacientes_senda"));let div=document.getElementById('lista');let html='';snap.forEach(s=>{let d=s.data();html+='<div style="border:1px solid #334155;padding:8px;margin:6px 0;border-radius:6px;font-size:0.8rem">'+d.fecha+' '+d.hora+' - '+d.apellidos+' '+d.nombres+' ('+d.tipo_estudio+') - '+d.obra_social+' <button onclick="borrar(\''+s.id+'\')" style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:4px;float:right">X</button></div>';});div.innerHTML=html;}
window.borrar=async(id)=>{if(confirm('Borrar?')){await deleteDoc(doc(db,"pacientes_senda",id));location.reload();}}
</script><style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:12px}.box{max-width:600px;margin:auto;background:#1e293b;padding:16px;border-radius:12px;border:1px solid #334155}input,select{width:100%;padding:10px;margin-top:4px;border-radius:8px;background:#0f172a;border:1px solid #334155;color:#fff}label{font-size:0.7rem;color:#ffd166;margin-top:8px;display:block}button{padding:12px;background:#00f5d4;color:#000;font-weight:bold;border:none;border-radius:8px;width:100%;margin-top:10px}</style></head><body><div class="box"><h2 style="color:#00f5d4;text-align:center">SENDA ADMIN - Solo Lun Mar Jue</h2><label>Apellidos</label><input id="ap"><label>Nombres</label><input id="no"><label>DNI</label><input id="dni"><label>Obra Social</label><select id="os"><option>PARTICULAR</option><option>OSDE</option><option>SWISS MEDICAL</option><option>GALENO</option><option>MEDICUS</option><option>OMINT</option><option>IOMA</option><option>PAMI</option><option>OTRA</option></select><label>Tipo</label><select id="tipo" onchange="cambiarHoras()"><option value="EEG">EEG 21-22 / 22-23</option><option value="PSG_BASAL">PSG Basal 21-23 / 23-01 / 01-03 / 03-05</option><option value="PSG_RESP" selected>PSG Resp 23-05 (6hs)</option></select><label>Fecha</label><input type="date" id="fecha" onchange="validarDia()"><div id="aviso" style="min-height:18px;font-size:0.8rem;margin-top:4px"></div><label>Bloque</label><select id="hora"></select><button id="btn" onclick="crear()">Guardar Turno</button><hr style="margin:16px 0;border-color:#334155"><div id="lista"></div></div></body></html>
