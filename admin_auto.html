<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin AUTO Lun Mar Jue</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, deleteDoc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const IMGBB_API_KEY="ecaea9952d943c3b43e17626fe47f766";
let pacienteSel=null;let fechaCal=new Date();
function esTrabajo(fe){let d=fe.getDay();return d===1||d===2||d===4;}
function nombreDia(fe){return ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"][fe.getDay()];}
window.addEventListener('DOMContentLoaded',()=>{escuchar();render();});
function escuchar(){onSnapshot(collection(db,"solicitudes_turnos"),snap=>{let cont=document.getElementById('listaTurnos');cont.innerHTML="";snap.forEach(docSnap=>{let t=docSnap.data();let id=docSnap.id;let div=document.createElement('div');div.style.cssText="background:#1e293b;border:1px solid #334155;padding:10px;border-radius:10px;margin-bottom:8px";div.innerHTML=`<div style="display:flex;justify-content:space-between"><b style="color:#ffd166">${t.nombre_paciente}</b><span style="font-size:0.65rem;background:#334155;padding:2px 6px;border-radius:4px">${t.tipo_estudio||'EEG'} ${t.es_domicilio?'DOM':''}</span></div><div style="font-size:0.75rem;color:#94a3b8">📱 ${t.telefono} | Pref: ${t.fecha_preferida||''} ${t.hora_preferida||''}</div><button style="width:100%;margin-top:6px;background:#00f5d4;color:#000;border:none;padding:8px;border-radius:6px;font-weight:bold;cursor:pointer" onclick='autoAsignar(${JSON.stringify({id,...t}).replace(/'/g,"")})'>🚀 AUTO - Lun Mar Jue Noche</button>`;cont.appendChild(div);});});}
async function buscarHueco(tipo,fechaPrefStr){let fechaInicio=fechaPrefStr?new Date(fechaPrefStr):new Date();fechaInicio.setHours(12,0,0,0);for(let off=0;off<30;off++){let fecha=new Date(fechaInicio);fecha.setDate(fechaInicio.getDate()+off);if(!esTrabajo(fecha))continue;let ms=String(fecha.getMonth()+1).padStart(2,'0');let ds=String(fecha.getDate()).padStart(2,'0');let idDoc=`${fecha.getFullYear()}-${ms}-${ds}`;let snap=await getDoc(doc(db,"agenda_estados",idDoc));let bl=snap.exists()?snap.data().bloques||{}:{};if(tipo.includes("1H")||tipo.includes("EEG")){let orden=["22hs","21hs","23hs","00hs","01hs","02hs","03hs","04hs"];for(let h of orden){if(!bl[h])return{fechaDoc:idDoc,fechaObj:fecha,bloques:[h]};}}else if(tipo.includes("2H")){let pares=[["21hs","22hs"],["22hs","23hs"]];for(let p of pares){if(!bl[p[0]]&&!bl[p[1]])return{fechaDoc:idDoc,fechaObj:fecha,bloques:p};}}else{let seis=["23hs","00hs","01hs","02hs","03hs","04hs"];if(seis.every(h=>!bl[h]))return{fechaDoc:idDoc,fechaObj:fecha,bloques:seis};}}return null;}
window.autoAsignar=async function(p){pacienteSel=p;let tipo=p.tipo_estudio||"EEG 1H";let hueco=await buscarHueco(tipo,p.fecha_preferida);if(!hueco){alert("Sin hueco 30 días Lun/Mar/Jue");return;}confirmarFinal(hueco);};
window.confirmarFinal=async function(hueco){let fechaId=hueco.fechaDoc;let bloquesOcupar=hueco.bloques;let diasTxt=["DOMINGO","LUNES","MARTES","MIERCOLES","JUEVES","VIERNES","SABADO"];let [anio,mes,dia]=fechaId.split('-');let d=new Date(anio,mes-1,dia);let diaTxt=diasTxt[d.getDay()];let horaPrin=bloquesOcupar[0];let textoNoche=`NOCHE DEL ${diaTxt} ${dia}/${mes} - TURNO ${horaPrin} (madrugada del ${parseInt(dia)+1}/${mes}, corresponde a noche del ${diaTxt})`;if(bloquesOcupar.length===2)textoNoche=`NOCHE DEL ${diaTxt} ${dia}/${mes} - ${bloquesOcupar[0]} a ${bloquesOcupar[1]}`;if(bloquesOcupar.length===6)textoNoche=`NOCHE DEL ${diaTxt} ${dia}/${mes} LARGO 23 a 05hs`;let {id,telefono,nombre_paciente}=pacienteSel;const canvas=document.createElement('canvas');canvas.width=800;canvas.height=1000;let ctx=canvas.getContext('2d');ctx.fillStyle="#fff";ctx.fillRect(0,0,800,1000);ctx.fillStyle="#009688";ctx.fillRect(0,0,800,90);ctx.fillStyle="#fff";ctx.font="bold 24px sans-serif";ctx.fillText("SENDA - "+textoNoche,20,50);ctx.fillStyle="#111";ctx.font="bold 18px sans-serif";ctx.fillText("PACIENTE: "+nombre_paciente,40,150);ctx.fillText("TIPO: "+tipo,40,180);ctx.fillText(textoNoche,40,210);canvas.toBlob(async(blob)=>{let fd=new FormData();fd.append("image",blob,"turno.png");let res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,{method:"POST",body:fd});let r=await res.json();let urlImg=r.data.url;let docRef=doc(db,"agenda_estados",fechaId);let snap=await getDoc(docRef);let bl=snap.exists()?snap.data().bloques||{}:{};bloquesOcupar.forEach(h=>bl[h]={nombre:nombre_paciente,tipo});await setDoc(docRef,{bloques:bl});let nroEst=Date.now().toString().slice(-6);await setDoc(doc(db,"pacientes_senda",nroEst),{nro_estudio:nroEst,nombres:nombre_paciente,telefono,fecha:fechaId,hora:horaPrin,tipo_estudio:tipo,porciones:bloquesOcupar.join(','),estado:"NUEVO",noche:diaTxt});let msg=`Hola ${nombre_paciente}! Turno ${textoNoche} N°${nroEst} ${urlImg}`;window.open(`https://wa.me/549${telefono}?text=${encodeURIComponent(msg)}`,'_blank');await deleteDoc(doc(db,"solicitudes_turnos",id));render();},'image/png');}
async function render(){let grid=document.getElementById('gridCalendario');let lbl=document.getElementById('lblMes');grid.innerHTML="";let anio=fechaCal.getFullYear();let mes=fechaCal.getMonth();lbl.innerText=new Date(anio,mes,1).toLocaleString('es',{month:'long',year:'numeric'})+" - Solo Lun Mar Jue";let primer=new Date(anio,mes,1).getDay();let vacios=primer===0?6:primer-1;let total=new Date(anio,mes+1,0).getDate();for(let i=0;i<vacios;i++){let v=document.createElement('div');grid.appendChild(v);}for(let dia=1;dia<=total;dia++){let fecha=new Date(anio,mes,dia);let ms=String(mes+1).padStart(2,'0');let ds=String(dia).padStart(2,'0');let idDoc=`${anio}-${ms}-${ds}`;let celda=document.createElement('div');celda.style.cssText="background:"+(esTrabajo(fecha)?"#0f172a":"#1e293b")+";border:1px solid "+(esTrabajo(fecha)?"#ffd166":"#334155")+";min-height:100px;border-radius:6px;padding:3px;opacity:"+(esTrabajo(fecha)?"1":"0.3");let snap=await getDoc(doc(db,"agenda_estados",idDoc));let bl=snap.exists()?snap.data().bloques||{}:{};let html=`<div style="font-size:0.65rem;text-align:center;color:#94a3b8">${nombreDia(fecha)} ${dia} ${esTrabajo(fecha)?'🌙':''}</div>`;if(esTrabajo(fecha)){["21hs","22hs","23hs","00hs","01hs","02hs","03hs","04hs"].forEach(h=>{let b=bl[h];html+=`<div style="font-size:0.55rem;padding:1px;text-align:center;border-radius:3px;margin-top:1px;background:${b?'#064e3b':'#1e293b'};color:${b?'#6ee7b7':'#10b981'}">${h}:${b?b.nombre.split(' ')[0]:'LIBRE'}</div>`;});}celda.innerHTML=html;grid.appendChild(celda);}}
window.cambiarMes=function(d){fechaCal.setMonth(fechaCal.getMonth()+d);render();}
</script><style>body{background:#0f172a;color:#fff;padding:12px;font-family:sans-serif}.container{max-width:800px;margin:0 auto}.cal{border:1px solid #334155;padding:10px;border-radius:12px;margin-top:12px;background:#1e293b}.grid-mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.grid-sem{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:0.65rem;color:#94a3b8;margin-bottom:4px}</style></head><body><div class="container"><h1 style="color:#00f5d4;text-align:center">🌙 Admin AUTO - Lun Mar Jue Noche</h1><div style="background:#fef3c7;color:#92400e;padding:8px;border-radius:8px;font-size:0.75rem;text-align:center">Noche del Lunes = 21hs Lunes a 04hs Martes. Lunes 03hs es lunes noche, madrugada del martes. No hay Viernes.</div><div id="listaTurnos" style="margin-top:10px"></div><div class="cal"><div style="display:flex;justify-content:space-between"><button onclick="cambiarMes(-1)" style="padding:6px 10px;background:#334155;color:#fff;border:none;border-radius:6px">◀</button><h3 id="lblMes" style="color:#ffd166"></h3><button onclick="cambiarMes(1)" style="padding:6px 10px;background:#334155;color:#fff;border:none;border-radius:6px">▶</button></div><div class="grid-sem"><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div></div><div id="gridCalendario" class="grid-mes"></div></div></div></body></html>
