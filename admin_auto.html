<!DOCTYPE html>
<html lang="es" class="notranslate">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENDA Admin v6 - Lista Única</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(cfg); const db=getFirestore(app);

window.cambiarHoras=()=>{
 let t=document.getElementById('tipo').value; let sel=document.getElementById('hora'); sel.innerHTML='';
 if(t=='EEG') sel.innerHTML='<option value="21:00-22:00">21:00-22:00</option><option value="22:00-23:00" selected>22:00-23:00</option>';
 else if(t=='PSG_BASAL') sel.innerHTML='<option value="21:00-23:00">21:00-23:00</option><option value="23:00-01:00">23:00-01:00</option><option value="01:00-03:00">01:00-03:00</option><option value="03:00-05:00">03:00-05:00</option>';
 else sel.innerHTML='<option value="23:00-05:00" selected>23:00-05:00 (6hs)</option><option value="21:00-23:00">21:00-23:00</option>';
}

window.validarDia=()=>{
 let f=document.getElementById('fecha').value; if(!f) return;
 let dia=new Date(f+'T12:00:00').getDay();
 let btn=document.getElementById('btn'); let aviso=document.getElementById('aviso');
 if(dia!==1&&dia!==2&&dia!==4){aviso.innerHTML='❌ Solo LUN MAR JUE'; btn.disabled=true; btn.style.opacity='0.3';}
 else{aviso.innerHTML='✅ '+(dia==1?'LUNES NOCHE':dia==2?'MARTES NOCHE':'JUEVES NOCHE'); btn.disabled=false; btn.style.opacity='1';}
}

window.crearManual=async()=>{
 let ap=document.getElementById('ap').value.toUpperCase(); let no=document.getElementById('no').value.toUpperCase();
 let dni=document.getElementById('dni').value; let fecha=document.getElementById('fecha').value;
 let hora=document.getElementById('hora').value; let tipo=document.getElementById('tipo').value; let os=document.getElementById('os').value;
 if(!ap||!fecha){alert('Falta apellido o fecha');return;}
 let d=new Date(fecha+'T12:00:00'); let noche=d.getDay()==1?'LUNES':d.getDay()==2?'MARTES':'JUEVES';
 await addDoc(collection(db,"pacientes_senda"),{apellidos:ap,nombres:no,dni:dni,obra_social:os,fecha:fecha,hora:hora,tipo_estudio:tipo,noche:noche,estado:'CONFIRMADO',origen:'MANUAL',creado:new Date().toISOString()});
 alert('Guardado'); location.reload();
}

window.confirmar=async(id)=>{
 await updateDoc(doc(db,"pacientes_senda",id),{estado:'CONFIRMADO',confirmado_el:new Date().toISOString()});
 location.reload();
}
window.faltaPapel=async(id, nombre, fecha, hora)=>{
 let que=prompt('Qué falta? Ej: ORDEN, AUTORIZACION, DNI, AYUNO','ORDEN / AUTORIZACION');
 if(!que) return;
 await updateDoc(doc(db,"pacientes_senda",id),{estado:'FALTA_PAPEL',falta:que});
 let msg=encodeURIComponent(`Hola Julieta, al paciente ${nombre} del ${fecha} ${hora} le falta: ${que}`);
 window.open(`https://wa.me/?text=${msg}`,'_blank');
 location.reload();
}
window.corregir=async(id, actual)=>{
 let nuevo=prompt('Corregir datos (obra social, dni, hora). Escribí lo nuevo:', actual);
 if(!nuevo) return;
 await updateDoc(doc(db,"pacientes_senda",id),{obra_social:nuevo.toUpperCase(),corregido_el:new Date().toISOString()});
 location.reload();
}
window.cancelar=async(id)=>{
 if(!confirm('Cancelar turno?')) return;
 await updateDoc(doc(db,"pacientes_senda",id),{estado:'CANCELADO'});
 location.reload();
}
window.borrar=async(id)=>{
 if(!confirm('Borrar definitivo?')) return;
 await deleteDoc(doc(db,"pacientes_senda",id));
 location.reload();
}

async function cargar(){
 let q=query(collection(db,"pacientes_senda"),orderBy("fecha","asc"));
 let snap=await getDocs(q);
 let div=document.getElementById('lista'); let html='';
 let filtro=document.getElementById('filtro').value;
 snap.forEach(s=>{
  let d=s.data(); let id=s.id;
  if(filtro!='TODOS' && d.estado!=filtro) return;
  let color=d.estado=='PRE-RESERVA'?'#f59e0b':d.estado=='CONFIRMADO'?'#22c55e':d.estado=='FALTA_PAPEL'?'#f97316':'#ef4444';
  let noche=d.noche||''; 
  html+=`<div style="border-left:4px solid ${color};background:#1e293b;padding:10px;margin:8px 0;border-radius:8px">
  <b style="color:${color}">${d.estado}</b> - <b>${noche} ${d.fecha} ${d.hora}</b><br>
  ${d.apellidos} ${d.nombres} - DNI ${d.dni||''} - ${d.obra_social} - ${d.tipo_estudio}
  ${d.falta?`<br><span style="color:#f97316">FALTA: ${d.falta}</span>`:''}
  <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
   <button onclick="confirmar('${id}')" style="background:#22c55e;color:#000">✓ Confirmar</button>
   <button onclick="faltaPapel('${id}','${d.apellidos} ${d.nombres}','${d.fecha}','${d.hora}')" style="background:#f97316;color:#000">⚠️ Falta Papel</button>
   <button onclick="corregir('${id}','${d.obra_social}')" style="background:#334155;color:#fff">✏️ Corregir</button>
   <button onclick="cancelar('${id}')" style="background:#475569;color:#fff">Cancelar</button>
   <button onclick="borrar('${id}')" style="background:#000;color:#ef4444">Borrar</button>
  </div></div>`;
 });
 div.innerHTML=html||'No hay turnos';
}
window.onload=()=>{cambiarHoras(); cargar();};
</script>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:10px}.box{max-width:700px;margin:auto;background:#1e293b;padding:14px;border-radius:12px;border:1px solid #334155}input,select{width:100%;padding:10px;margin-top:4px;border-radius:8px;background:#0f172a;border:1px solid #334155;color:#fff}label{font-size:0.7rem;color:#ffd166;margin-top:6px;display:block}button{padding:8px 10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}h2{color:#00f5d4;text-align:center}</style>
</head>
<body>
<div class="box">
<h2>SENDA ADMIN v6 - Lista Única</h2>
<p style="font-size:0.75rem;color:#94a3b8;text-align:center">Todo lo que cargan los pacientes + lo manual. Lo ven todos.</p>

<details><summary style="cursor:pointer;color:#ffd166">+ Carga manual (por teléfono)</summary>
<label>Apellidos</label><input id="ap"><label>Nombres</label><input id="no"><label>DNI</label><input id="dni">
<label>Obra Social</label><select id="os"><option>PARTICULAR</option><option>OSDE</option><option>SWISS MEDICAL</option><option>GALENO</option><option>MEDICUS</option><option>OMINT</option><option>IOMA</option><option>PAMI</option><option>OTRA</option></select>
<label>Tipo</label><select id="tipo" onchange="cambiarHoras()"><option value="EEG">EEG 21-22 / 22-23</option><option value="PSG_BASAL">PSG Basal 21-23 / 23-01 / 01-03 / 03-05</option><option value="PSG_RESP" selected>PSG Resp 23-05 (6hs)</option></select>
<label>Fecha (solo Lun Mar Jue)</label><input type="date" id="fecha" onchange="validarDia()"><div id="aviso" style="min-height:18px;font-size:0.8rem"></div>
<label>Bloque</label><select id="hora"></select>
<button id="btn" onclick="crearManual()" style="width:100%;margin-top:8px;background:#00f5d4">Guardar Manual como CONFIRMADO</button>
</details>

<hr style="margin:14px 0;border-color:#334155">
<label>Filtrar lista</label><select id="filtro" onchange="cargar()"><option value="TODOS">TODOS</option><option value="PRE-RESERVA">PRE-RESERVA</option><option value="CONFIRMADO">CONFIRMADO</option><option value="FALTA_PAPEL">FALTA PAPEL</option><option value="CANCELADO">CANCELADO</option></select>

<div id="lista" style="margin-top:10px">Cargando...</div>
</div>
</body>
</html>
